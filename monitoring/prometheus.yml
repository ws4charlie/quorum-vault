# A minimal Prometheus for the MPC counters and rules (docker compose --profile monitoring; `make monitoring-up`). It only reads: it scrapes
# and evaluates, it has no admin API and no lifecycle endpoint (both are off unless a flag turns them on), and nothing in the signing zone depends
# on it. In production this runs in central monitoring, outside the signing zone, and reaches the parties' metrics ports (config metrics_listen).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# relative to this file
rule_files:
  - mpc-routing.rules.yml
  - mpc-blame.rules.yml
  - audit-archive.rules.yml
  - tls-cert.rules.yml
  - attest-broker.rules.yml
  - party-sealer.rules.yml
  - drain.rules.yml

scrape_configs:
  # every party's metrics port: qv_mpc_party_session_failures_total. Local development: start the parties with metrics_listen on these ports.
  - job_name: mpc-party
    static_configs:
      - targets: ["host.docker.internal:9464", "host.docker.internal:9465", "host.docker.internal:9466"]
  # the gateway opens no port: it writes -mpc-metrics-file, which node-exporter serves through its textfile collector
  - job_name: qv-gateway
    static_configs:
      - targets: ["node-exporter:9100"]
  # qv-anchor-archiver (-metrics-listen): the audit-head archive's lag and errors. Run it outside the signing zones.
  - job_name: qv-anchor-archiver
    static_configs:
      - targets: ["host.docker.internal:9103"]
  # Certificate expiry (qv_tls_cert_*), from every service that has a metrics port (-metrics-listen, loopback only); the gateway writes it into the textfile
  # directory next to its MPC metrics. qv-core:
  - job_name: qv-core
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: qv-relay
    static_configs:
      - targets: ["host.docker.internal:9102"]
  - job_name: qv-cosigner
    static_configs:
      - targets: ["host.docker.internal:9104"]
