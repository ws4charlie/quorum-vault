rule_files:
  - deposits.rules.yml
evaluation_interval: 1m
tests:
  # held for the fee, age grows with time: the alert opens after the day plus the 15 minutes, and closes when the series is gone
  - interval: 1m
    input_series:
      - series: 'qv_sweep_held_oldest_seconds{chain="evm",asset="ETH",cause="fee"}'
        values: '0+60x1500 _x200'
    alert_rule_test:
      - {eval_time: 1000m, alertname: QVDepositsHeldTooLong, exp_alerts: []}
      - eval_time: 1460m
        alertname: QVDepositsHeldTooLong
        exp_alerts:
          - exp_labels: {severity: ticket, chain: evm, asset: ETH}
            exp_annotations:
              summary: "Credited deposits of ETH on evm have waited over a day below the sweep threshold"
              description: "The fee alone has held them for more than a day. Look at GET /v2/reconcile (unswept), the fee on the chain and the sweep-planner workflow. Runbook: docs/runbooks/unswept-deposits.md"
      - {eval_time: 1600m, alertname: QVDepositsHeldTooLong, exp_alerts: []}
  # a series already over the wait at its first sample (a new pod) still fires
  - interval: 1m
    input_series:
      - series: 'qv_sweep_held_oldest_seconds{chain="btc",asset="BTC",cause="fee_cap"}'
        values: '90000x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: QVDepositsHeldTooLong
        exp_alerts:
          - exp_labels: {severity: ticket, chain: btc, asset: BTC}
            exp_annotations:
              summary: "Credited deposits of BTC on btc have waited over a day below the sweep threshold"
              description: "The fee alone has held them for more than a day. Look at GET /v2/reconcile (unswept), the fee on the chain and the sweep-planner workflow. Runbook: docs/runbooks/unswept-deposits.md"
  # under the floor waits for more funds: no alert however old
  - interval: 1m
    input_series:
      - series: 'qv_sweep_held_oldest_seconds{chain="evm",asset="ETH",cause="min_sweep"}'
        values: '900000x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: QVDepositsHeldTooLong, exp_alerts: []}
  # held for an hour: normal
  - interval: 1m
    input_series:
      - series: 'qv_sweep_held_oldest_seconds{chain="evm",asset="ETH",cause="fee"}'
        values: '3600x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: QVDepositsHeldTooLong, exp_alerts: []}
  # the metrics cannot be read
  - interval: 1m
    input_series:
      - series: 'qv_sweep_held_metrics_error{job="qv-worker"}'
        values: '1x30'
    alert_rule_test:
      - {eval_time: 5m, alertname: QVSweepHeldMetricsError, exp_alerts: []}
      - eval_time: 15m
        alertname: QVSweepHeldMetricsError
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "The held-deposit metrics cannot be read from the database"
              description: "qv-worker could not read sweep_holds at its scrapes: the age alert is blind. Check the worker's database connection and the migration state. Runbook: docs/runbooks/unswept-deposits.md"
