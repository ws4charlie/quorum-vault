# Redpanda for the business namespace: the same flags and the same start script and access rules as the compose stack (deploy/redpanda/start.sh, acl.sh).
# TLS with a client certificate from the business authority on the only listener; the principal is the certificate's CN; ACLs by name. One broker, dev-container mode.
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: qv }
spec:
  publishNotReadyAddresses: true   # the pod's own ACL step dials this Service before the pod is ready (ready = ACLs made)
  selector: { app.kubernetes.io/name: redpanda }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redpanda, namespace: qv }
spec:
  serviceName: redpanda
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redpanda } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redpanda, app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/cfg/start.sh"]
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --advertise-kafka-addr=internal://redpanda.qv.svc:9092
            - --set
            - 'redpanda.kafka_api_tls=[{"name":"internal","enabled":true,"require_client_auth":true,"cert_file":"/tmp/tls/tls.crt","key_file":"/tmp/tls/tls.key","truststore_file":"/tmp/tls/ca.crt"}]'
            - --set
            - 'redpanda.kafka_api=[{"name":"internal","address":"0.0.0.0","port":9092,"authentication_method":"mtls_identity"}]'
            - --set
            - redpanda.kafka_enable_authorization=true
            - --set
            - "redpanda.superusers=[admin]"
            - --set
            - 'redpanda.kafka_mtls_principal_mapping_rules=["RULE:^.*CN=([^,]+).*$/$1/"]'
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            exec: { command: ["/bin/bash", "-c", "rpk cluster health | grep -E 'Healthy:.+true' && test -f /tmp/acl-ready"] }
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 60
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1280Mi } }
          volumeMounts:
            - { name: pki, mountPath: /pki, readOnly: true }
            - { name: admin, mountPath: /admin, readOnly: true }
            - { name: cfg, mountPath: /cfg, readOnly: true }
            - { name: data, mountPath: /var/lib/redpanda/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: pki, secret: { secretName: qv-kafka-tls } }
        - { name: admin, secret: { secretName: qv-admin-tls } }
        - { name: cfg, configMap: { name: redpanda-cfg, defaultMode: 0555 } }
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
