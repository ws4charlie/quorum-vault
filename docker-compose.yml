# Dev-only Postgres. Credentials are documented dev defaults (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorumvault
      POSTGRES_USER: qv
      POSTGRES_PASSWORD: qv-dev
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qv -d quorumvault"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
