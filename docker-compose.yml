# Host ports can be moved with QV_PG_PORT, QV_SIGNING_DB_PORT, QV_ANVIL_PORT, QV_TEMPORAL_PORT, QV_KAFKA_PORT, QV_BTC_PORT, QV_SOL_PORT and QV_PROM_PORT (scripts/e2e-all.sh runs
# several isolated sets side by side); with none set they are the fixed ports below.
# Dev-only services, reachable only from this machine. The two Postgres servers take TLS connections with a client certificate only (no passwords,
# no plain connections): `make pki` (scripts/pki.sh) writes the certificates they read from QV_PKI_DIR (default data/pki), and `make setup` runs it first.
# Each server trusts the ONE authority of its zone: `postgres` the business authority, `signing-db` the signing authority.
services:
  # The business database. Certificate common names map to roles in deploy/postgres/business.pg_ident.conf.
  postgres:
    image: postgres:16-alpine
    # (the health checks use TCP: while the image initialises a new volume its temporary server answers on the socket only, which is not "ready")
    entrypoint: ["/bin/sh", "/cfg/entrypoint.sh"]
    environment:
      POSTGRES_DB: quorumvault
      POSTGRES_USER: qv
      POSTGRES_HOST_AUTH_METHOD: trust # only for initdb; pg_hba.conf (hostssl ... cert) is what applies
    ports:
      - "127.0.0.1:${QV_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${QV_PKI_DIR:-./data/pki}/business/postgres:/pki:ro
      - ./deploy/postgres/entrypoint.sh:/cfg/entrypoint.sh:ro
      - ./deploy/postgres/business.pg_hba.conf:/cfg/pg_hba.conf:ro
      - ./deploy/postgres/business.pg_ident.conf:/cfg/pg_ident.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qv -d quorumvault"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The signing zone's Postgres: the gateway's and the cosigner's replay-guard databases. A different server and a different authority from the
  # business one, so nothing the business side holds opens it.
  signing-db:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/cfg/entrypoint.sh"]
    environment:
      POSTGRES_DB: qv_signing
      POSTGRES_USER: qv
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${QV_SIGNING_DB_PORT:-55433}:5432"
    volumes:
      - signing-pgdata:/var/lib/postgresql/data
      - ${QV_PKI_DIR:-./data/pki}/signing/signing-db:/pki:ro
      - ./deploy/postgres/entrypoint.sh:/cfg/entrypoint.sh:ro
      - ./deploy/postgres/signing.pg_hba.conf:/cfg/pg_hba.conf:ro
      - ./deploy/postgres/signing.pg_ident.conf:/cfg/pg_ident.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qv -d qv_signing"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local EVM node impersonating Ethereum Sepolia (chain ID 11155111), so the
  # Sepolia txs the sign path produces are broadcast unchanged and mined.
  # Automine: every tx is mined at once in its own block. State is in memory
  # (lost on restart). Pinned: foundry v1.8.5 (2026-10-05).
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    command: ["anvil --host 0.0.0.0 --chain-id 11155111"]
    ports:
      - "127.0.0.1:${QV_ANVIL_PORT:-18545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local stand-in for Base Sepolia (chain ID 84532, the testnet x402 payments run on): the devnet for the EIP-3009 tests (`make base-up`, profile
  # x402, host port 18546). The tests deploy their own USDC-like token (contracts/test/mocks/Tokens.sol). Nothing here talks to a public network.
  anvil-base-sepolia:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    profiles: ["x402"]
    command: ["anvil --host 0.0.0.0 --chain-id 84532"]
    ports:
      - "127.0.0.1:${QV_ANVIL_BASE_PORT:-18546}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Phase 2 infrastructure (profile "infra"; `make infra-up`) ----
  # Temporal keeps its own Postgres, separate from the business database.
  # Pinned: temporalio/server + admin-tools 1.32.1 (2026-10-08), ui 2.56.0
  # (2026-10-13), redpanda v26.2.4 (2026-10-06). temporalio/auto-setup is
  # deprecated upstream, so schema setup is an explicit one-shot job.
  temporal-db:
    profiles: ["infra"]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/cfg/entrypoint.sh"]
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_HOST_AUTH_METHOD: trust # only for initdb; the hba file requires TLS and a certificate
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
      - ${QV_PKI_DIR:-./data/pki}/business/temporal-db:/pki:ro
      - ./deploy/postgres/entrypoint.sh:/cfg/entrypoint.sh:ro
      - ./deploy/postgres/temporal.pg_hba.conf:/cfg/pg_hba.conf:ro
      - ./deploy/postgres/temporal.pg_ident.conf:/cfg/pg_ident.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U temporal -d temporal"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-schema:
    profiles: ["infra"]
    image: temporalio/admin-tools:1.32.1
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: "no"
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: temporal-db
      SQL_PORT: "5432"
      SQL_USER: temporal
      # TLS, with the Temporal service's own certificate as the client certificate (name temporal -> role temporal)
      SQL_TLS: "true"
      SQL_TLS_CERT_FILE: /pki/tls.crt
      SQL_TLS_KEY_FILE: /tmp/sql.key # a copy: the Postgres driver insists on a key file that only its user can read
      SQL_TLS_CA_FILE: /pki/ca.crt
      SQL_TLS_SERVER_NAME: temporal-db
    volumes:
      - ${QV_PKI_DIR:-./data/pki}/business/temporal:/pki:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /pki/tls.key /tmp/sql.key && chmod 600 /tmp/sql.key
        temporal-sql-tool --db temporal create-database || true
        temporal-sql-tool --db temporal setup-schema -v 0.0
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --db temporal_visibility create-database || true
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    profiles: ["infra"]
    image: temporalio/server:1.32.1
    entrypoint: ["/bin/sh", "-c", "cp /pki/tls.key /tmp/sql.key && chmod 600 /tmp/sql.key && exec /etc/temporal/entrypoint.sh"]
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ""
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
      # its database: TLS, temporal-db's certificate checked, our certificate as the client certificate
      SQL_TLS_ENABLED: "true"
      SQL_CA: /pki/ca.crt
      SQL_CERT: /pki/tls.crt
      SQL_CERT_KEY: /tmp/sql.key # a copy made at start (the entrypoint below): the Postgres driver insists on a key file that only its user can read
      SQL_HOST_VERIFICATION: "true"
      SQL_HOST_NAME: temporal-db
      # the frontend: TLS, and a client certificate of the business authority from every caller (workers, the core, tests); the files are
      # re-read every minute, so a renewed certificate needs no restart
      TEMPORAL_TLS_FRONTEND_CERT: /pki/tls.crt
      TEMPORAL_TLS_FRONTEND_KEY: /pki/tls.key
      TEMPORAL_TLS_CLIENT1_CA_CERT: /pki/ca.crt
      TEMPORAL_TLS_CLIENT2_CA_CERT: /pki/ca.crt
      TEMPORAL_TLS_REQUIRE_CLIENT_AUTH: "true"
      TEMPORAL_TLS_SERVER_CA_CERT: /pki/ca.crt
      TEMPORAL_TLS_FRONTEND_SERVER_NAME: temporal
      # the cluster's own traffic (history, matching, the system worker through the internal frontend) is TLS with the same certificate; with the
      # frontend demanding client certificates, the system worker needs the internal frontend
      TEMPORAL_TLS_SERVER_CERT: /pki/tls.crt
      TEMPORAL_TLS_SERVER_KEY: /pki/tls.key
      TEMPORAL_TLS_INTERNODE_SERVER_NAME: temporal
      USE_INTERNAL_FRONTEND: "true"
      TEMPORAL_SERVICES: frontend,internal-frontend,history,matching,worker
      TEMPORAL_TLS_REFRESH_INTERVAL: 1m
      # the gate (a TCP proxy) calls the frontend without negotiating HTTP/2 itself; the frontend must not insist on ALPN from it
      GRPC_ENFORCE_ALPN_ENABLED: "false"
      TEMPORAL_TLS_EXPIRATION_CHECKS_WARNING_WINDOW: 4h
    configs:
      - source: temporal-dynamicconfig
        target: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ${QV_PKI_DIR:-./data/pki}/business/temporal:/pki:ro
    healthcheck:
      # the server image ships no temporal CLI, so check the frontend port
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Development identity provider: Keycloak, with the dev realm in deploy/keycloak (test users only; see docs/identity.md). Production uses the
  # customer's own OpenID Connect provider (Okta, Entra, ...); nothing outside this service is specific to Keycloak.
  #   docker compose --profile identity up -d --wait keycloak     (or: make keycloak-up)
  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    # No default passwords: `make keycloak-up` (scripts/keycloak-env.sh) writes random ones to .env, and Keycloak fills the realm's ${...} placeholders from them.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$KC_BOOTSTRAP_ADMIN_PASSWORD" ] || { echo "QV_KEYCLOAK_ADMIN_PASSWORD is unset: run make keycloak-up (scripts/keycloak-env.sh)"; exit 1; }; exec /opt/keycloak/bin/kc.sh start-dev --import-realm'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${QV_KEYCLOAK_ADMIN_PASSWORD:-}
      QV_TEST_PASSWORD_ALICE: ${QV_TEST_PASSWORD_ALICE:-}
      QV_TEST_PASSWORD_BOB: ${QV_TEST_PASSWORD_BOB:-}
      QV_TEST_PASSWORD_CAROL: ${QV_TEST_PASSWORD_CAROL:-}
      QV_TEST_PASSWORD_OPS: ${QV_TEST_PASSWORD_OPS:-}
      QV_KEYCLOAK_GUARDIAN_SECRET: ${QV_KEYCLOAK_GUARDIAN_SECRET:-}
      # https only, with a certificate of the business authority (name keycloak, 127.0.0.1): the core refuses an http issuer in production, and the
      # tests now run against the https one. The management port (health) stays plain http, inside the container.
      KC_HOSTNAME: https://127.0.0.1:${QV_KEYCLOAK_PORT:-8180}
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /pki/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /pki/tls.key
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/quorumvault-realm.json:/opt/keycloak/data/import/quorumvault-realm.json:ro
      - ${QV_PKI_DIR:-./data/pki}/business/keycloak:/pki:ro
    ports:
      - "127.0.0.1:${QV_KEYCLOAK_PORT:-8180}:8443"
    healthcheck:
      # The image has no curl: open the management port and ask for readiness.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # The only way to the frontend from outside the compose network: TLS, a client certificate of the business authority, AND a list of the names that
  # may call (deploy/temporal-gate/nginx.conf). The frontend itself checks only the authority.
  temporal-gate:
    profiles: ["infra"]
    image: nginx:1.27-alpine
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/cfg/start.sh"]
    ports:
      - "127.0.0.1:${QV_TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ${QV_PKI_DIR:-./data/pki}/business/temporal:/pki:ro
      - ./deploy/temporal-gate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/temporal-gate/start.sh:/cfg/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 3s
      timeout: 5s
      retries: 20

  temporal-ui:
    profiles: ["infra"]
    image: temporalio/ui:2.56.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # the UI is a client of the frontend like any other: it shows the admin certificate
      TEMPORAL_TLS_CA: /pki/ca.crt
      TEMPORAL_TLS_CERT: /pki/tls.crt
      TEMPORAL_TLS_KEY: /pki/tls.key
      TEMPORAL_TLS_ENABLE_HOST_VERIFICATION: "true"
      TEMPORAL_TLS_SERVER_NAME: temporal
    volumes:
      - ${QV_PKI_DIR:-./data/pki}/business/admin:/pki:ro
    ports:
      - "127.0.0.1:${QV_TEMPORAL_UI_PORT:-8233}:8080"

  # Single-node Kafka-API broker for the outbox relay. Kafka API on 19092. TLS with a client certificate from the business authority only; the
  # principal is the certificate's common name (the service name), and ACLs (deploy/redpanda/acl.sh) say what each name may do. `admin` is the
  # superuser (operators, tests). Redpanda re-reads its certificate files by itself.
  redpanda:
    profiles: ["infra"]
    image: redpandadata/redpanda:v26.2.4
    # start.sh starts the broker and makes the ACLs (deploy/redpanda/acl.sh) as soon as it is up; the health check waits for them
    entrypoint: ["/bin/bash", "/cfg/start.sh"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${QV_KAFKA_PORT:-19092}
      - --set
      # (no spaces in these values: the image's entrypoint splits its arguments at spaces; JSON is YAML)
      - 'redpanda.kafka_api_tls=[{"name":"internal","enabled":true,"require_client_auth":true,"cert_file":"/tmp/tls/tls.crt","key_file":"/tmp/tls/tls.key","truststore_file":"/tmp/tls/ca.crt"},{"name":"external","enabled":true,"require_client_auth":true,"cert_file":"/tmp/tls/tls.crt","key_file":"/tmp/tls/tls.key","truststore_file":"/tmp/tls/ca.crt"}]'
      - --set
      - 'redpanda.kafka_api=[{"name":"internal","address":"0.0.0.0","port":9092,"authentication_method":"mtls_identity"},{"name":"external","address":"0.0.0.0","port":${QV_KAFKA_PORT:-19092},"authentication_method":"mtls_identity"}]'
      - --set
      - redpanda.kafka_enable_authorization=true
      - --set
      - "redpanda.superusers=[admin]"
      - --set
      - 'redpanda.kafka_mtls_principal_mapping_rules=["RULE:^.*CN=([^,]+).*$$/$$1/"]'
    ports:
      - "127.0.0.1:${QV_KAFKA_PORT:-19092}:${QV_KAFKA_PORT:-19092}"
    volumes:
      - ${QV_PKI_DIR:-./data/pki}/business/kafka:/pki:ro
      - ${QV_PKI_DIR:-./data/pki}/business/admin:/admin:ro
      - ./deploy/redpanda/start.sh:/cfg/start.sh:ro
      - ./deploy/redpanda/acl.sh:/cfg/acl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' && test -f /tmp/acl-ready"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---- Bitcoin (profile "btc"; `make btc-up`) ----
  # bitcoind in regtest, RPC on 18443, cookie authentication: bitcoind writes a new user and password to /home/bitcoin/.bitcoin/regtest/.cookie
  # at every start, and the tests read it with `docker compose exec` (so every compose project, one per lane, has its own). No credential is
  # committed. -txindex=1: the cell reads its own confirmed transactions with getrawtransaction. Pinned: bitcoin/bitcoin 29.0 (the official image, Bitcoin Core 29.0).
  bitcoind:
    profiles: ["btc"]
    image: bitcoin/bitcoin:29.0
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -fallbackfee=0.0002
      - -txindex=1
      - -persistmempool=0 # a restarted node starts with an empty mempool, as a crash or eviction leaves it
    ports:
      - "127.0.0.1:${QV_BTC_PORT:-18443}:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -datadir=/home/bitcoin/.bitcoin -regtest -rpcport=18443 getblockcount"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Solana (profile "solana"; `make sol-up`) ----
  # solana-test-validator (Agave v3.0.14, built from the pinned release tarball: ci/solana/Dockerfile), RPC on 8899 inside, QV_SOL_PORT outside.
  # A fresh ledger at every start; 100 ms slots and the default epoch length (see ci/solana/Dockerfile for why not shorter), so a transaction is final (rooted) in a few seconds. The faucet is inside the container and
  # reached through the RPC (requestAirdrop); no key is committed anywhere.
  solana:
    profiles: ["solana"]
    build:
      context: ci/solana
    # CI pulls the image built once by the `image` job (ci/ensure-image.sh solana) and names it in QV_SOLANA_IMAGE; elsewhere it is built here.
    image: ${QV_SOLANA_IMAGE:-qv-solana-test:v3.0.14}
    platform: linux/amd64
    ports:
      - "127.0.0.1:${QV_SOL_PORT:-18899}:8899"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://127.0.0.1:8899 | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 60

  # ---- Audit archive (profile "archive"; `docker compose --profile archive up -d --wait seaweedfs`) ----
  # S3 store with Object Lock for qv-anchor-archiver (docs/runbooks/audit-archive.md, docs/spikes/audit-worm.md). Host port QV_ARCHIVE_PORT (default
  # 18333). Two identities, both from the environment (nothing is committed): root (QV_ARCHIVE_ROOT_ACCESS_KEY / _SECRET_KEY, creates the bucket)
  # and the archiver (QV_ARCHIVE_ACCESS_KEY / _SECRET_KEY; SeaweedFS needs its "Admin" action to let it READ the bucket lock configuration at start; the lock, not the identity, is what stops deletes here). The bucket is created by the operator with Object Lock; the
  # archiver refuses to start on a bucket that is not locked in COMPLIANCE mode. Data in the `archive-data` volume. The tests start their own
  # container from this same image. Pinned: chrislusf/seaweedfs 4.53 (2026-11-16), by digest of the multi-arch index (tests read this line).
  seaweedfs:
    profiles: ["archive"]
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    environment:
      ROOT_AK: ${QV_ARCHIVE_ROOT_ACCESS_KEY:-}
      ROOT_SK: ${QV_ARCHIVE_ROOT_SECRET_KEY:-}
      ARC_AK: ${QV_ARCHIVE_ACCESS_KEY:-}
      ARC_SK: ${QV_ARCHIVE_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # empty keys would start a store anyone can write to; compose cannot require them for this profile only, so the container does
        : "$${ROOT_AK:?set QV_ARCHIVE_ROOT_ACCESS_KEY}" "$${ROOT_SK:?set QV_ARCHIVE_ROOT_SECRET_KEY}" "$${ARC_AK:?set QV_ARCHIVE_ACCESS_KEY}" "$${ARC_SK:?set QV_ARCHIVE_SECRET_KEY}"
        printf '{"identities":[{"name":"root","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"archiver","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Admin"]}]}' "$$ROOT_AK" "$$ROOT_SK" "$$ARC_AK" "$$ARC_SK" > /tmp/s3.json
        # TLS only, and a client certificate of the business authority (SeaweedFS checks the authority, not the name; the access keys identify the caller)
        exec /entrypoint.sh server -dir=/data -s3 -s3.config=/tmp/s3.json -s3.port=0 -s3.port.https=8333 -s3.cert.file=/pki/tls.crt -s3.key.file=/pki/tls.key -s3.cacert.file=/pki/ca.crt -s3.tlsVerifyClientCert -master.volumeSizeLimitMB=256 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:${QV_ARCHIVE_PORT:-18333}:8333"
    volumes:
      - archive-data:/data
      - ${QV_PKI_DIR:-./data/pki}/business/seaweedfs:/pki:ro
    healthcheck:
      # the port answers TLS only: a plain request gets a 400, which is "up"
      test: ["CMD-SHELL", "wget -q -O /dev/null --spider http://127.0.0.1:8333/ ; [ $$? -ne 4 ]"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Monitoring (profile "monitoring"; `make monitoring-up`) ----
  # Read-only Prometheus over monitoring/: scrapes the parties' metrics ports and the gateway's metrics file (through node-exporter's textfile
  # collector) and evaluates the MPC rules. No admin API, no lifecycle endpoint, config mounted read-only. Not part of `make setup` or the e2e
  # lanes. Pinned: prom/prometheus v3.5.0 (2026-11-15; monitoring/rules_test.go reads this tag), prom/node-exporter v1.9.1 (2026-11-15).
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${QV_PROM_PORT:-19090}:9090"

  # The gateway writes its MPC metrics file (qv-gateway -mpc-metrics-file) into QV_MPC_METRICS_DIR; only the textfile collector runs.
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    command: ["--collector.disable-defaults", "--collector.textfile", "--collector.textfile.directory=/mpc-metrics"]
    volumes:
      - ${QV_MPC_METRICS_DIR:-./.mpc-metrics}:/mpc-metrics:ro

# The server image needs a dynamic-config file; an empty one means defaults.
configs:
  temporal-dynamicconfig:
    content: "{}\n"

volumes:
  pgdata:
  signing-pgdata:
  archive-data:
  temporal-pgdata:
