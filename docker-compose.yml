# Dev-only Postgres: no password (trust auth), reachable only from this machine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorumvault
      POSTGRES_USER: qv
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qv -d quorumvault"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
