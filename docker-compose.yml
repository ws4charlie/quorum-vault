# Dev-only services, reachable only from this machine. Postgres: no password
# (trust auth).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorumvault
      POSTGRES_USER: qv
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qv -d quorumvault"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local EVM node impersonating Ethereum Sepolia (chain ID 11155111), so the
  # Sepolia txs the sign path produces are broadcast unchanged and mined.
  # Automine: every tx is mined at once in its own block. State is in memory
  # (lost on restart). Pinned: foundry v1.8.5 (2026-10-05).
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    command: ["anvil --host 0.0.0.0 --chain-id 11155111"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Phase 2 infrastructure (profile "infra"; `make infra-up`) ----
  # Temporal keeps its own Postgres, separate from the business database.
  # Pinned: temporalio/server + admin-tools 1.32.1 (2026-10-08), ui 2.56.0
  # (2026-10-13), redpanda v26.2.4 (2026-10-06). temporalio/auto-setup is
  # deprecated upstream, so schema setup is an explicit one-shot job.
  temporal-db:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-schema:
    profiles: ["infra"]
    image: temporalio/admin-tools:1.32.1
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: "no"
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: temporal-db
      SQL_PORT: "5432"
      SQL_USER: temporal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        temporal-sql-tool --db temporal create-database || true
        temporal-sql-tool --db temporal setup-schema -v 0.0
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --db temporal_visibility create-database || true
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    profiles: ["infra"]
    image: temporalio/server:1.32.1
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ""
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    configs:
      - source: temporal-dynamicconfig
        target: /etc/temporal/dynamicconfig.yaml
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      # the server image ships no temporal CLI, so check the frontend port
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  temporal-ui:
    profiles: ["infra"]
    image: temporalio/ui:2.56.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"

  # Single-node Kafka-API broker for the outbox relay. Kafka API on 19092.
  redpanda:
    profiles: ["infra"]
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---- Bitcoin (profile "btc"; `make btc-up`) ----
  # bitcoind in regtest, RPC on 18443. Dev only: the RPC password is a throwaway for a node that exists on this machine for
  # the tests. -txindex=1: the cell reads its own confirmed transactions with getrawtransaction. Pinned: bitcoin/bitcoin 29.0 (the official image, Bitcoin Core 29.0).
  bitcoind:
    profiles: ["btc"]
    image: bitcoin/bitcoin:29.0
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -rpcuser=qv
      - -rpcpassword=qv-regtest-only
      - -fallbackfee=0.0002
      - -txindex=1
      - -persistmempool=0 # a restarted node starts with an empty mempool, as a crash or eviction leaves it
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcport=18443 -rpcuser=qv -rpcpassword=qv-regtest-only getblockcount"]
      interval: 2s
      timeout: 3s
      retries: 30

# The server image needs a dynamic-config file; an empty one means defaults.
configs:
  temporal-dynamicconfig:
    content: "{}\n"

volumes:
  pgdata:
  temporal-pgdata:
