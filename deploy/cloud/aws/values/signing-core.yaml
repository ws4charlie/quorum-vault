# qv-signing-core on the AWS signing-core cluster (roots/signing-core). Addresses are the private endpoint interfaces of THIS VPC: output endpoint_ips.
guard:
  host: qv-guard-rw
jobs:
  host: business-postgres.qv.internal                 # private zone name made by the private-link module; the business certificate must carry it as a DNS name
kafka:
  brokers: business-kafka.qv.internal:9092,business-kafka.qv.internal:9093,business-kafka.qv.internal:9094
network:
  jobsDb:
    peers: [{ ipBlock: { cidr: <signing-core.endpoint_ips.gateway-jobs-db.0>/32 } }]   # one entry per zone
  kafka:
    peers: [{ ipBlock: { cidr: <signing-core.endpoint_ips.gateway-heads.0>/32 } }]
  parties:
    b: { peers: [{ ipBlock: { cidr: <signing-core.endpoint_ips.gateway-party-b-caller.0>/32 } }], port: 7002 }
    c: { peers: [{ ipBlock: { cidr: <signing-core.endpoint_ips.gateway-party-c-caller.0>/32 } }], port: 7003 }
