# qv-party, role C, in the party-c cluster (roots/party-c), namespace qv-party-c. The guard database (CloudNativePG cluster qv-guard) is in the SAME namespace.
# Every endpoint has one interface per subnet: list ALL of them. Three zones shown; drop the .2 lines with two zones.
role: C
hsm: { provider: cloudhsm }                           # the party's own CloudHSM cluster (modules/hsm); module.path and module.volume: your vendor-module volume
persistence:
  storageClassName: qv-gp3-encrypted                  # kmsKeyId = <party-c.kms_keys.ebs>
service:
  # The qv-party chart makes the internal NLBs (type LoadBalancer + the annotations qv-policy requires). After they exist, apply the root again with nlb_services.
  caller:
    type: LoadBalancer
    annotations:
      quorumvault.io/endpoint: private
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    sourceRanges: [<signing-core VPC range from cidrs.json>]
  peer:
    type: LoadBalancer
    annotations:
      quorumvault.io/endpoint: private
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    sourceRanges: [<signing-core VPC range from cidrs.json>, <party-b VPC range from cidrs.json>]
network:
  # PrivateLink traffic reaches the pods from the NLB nodes, which sit in THIS VPC's private subnets (output private_subnet_cidrs): that is the source a NetworkPolicy sees.
  callerIngress:
    from:
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.0> }
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.1> }
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.2> }
  peerIngress:
    from:
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.0> }
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.1> }
      - ipBlock: { cidr: <party-c.private_subnet_cidrs.2> }
  guardDatabase: { to: [{ podSelector: { matchLabels: { cnpg.io/cluster: qv-guard } } }], ports: [5432] }
  kafka:
    to:
      - ipBlock: { cidr: <party-c.endpoint_ips.cosigner-c-heads.0>/32 }
      - ipBlock: { cidr: <party-c.endpoint_ips.cosigner-c-heads.1>/32 }
      - ipBlock: { cidr: <party-c.endpoint_ips.cosigner-c-heads.2>/32 }
    ports: [9092, 9093, 9094]
  hsm:
    to:
      - ipBlock: { cidr: <party-c.hsm.ips.0>/32 }
      - ipBlock: { cidr: <party-c.hsm.ips.1>/32 }
    ports: [2223, 2224, 2225]
