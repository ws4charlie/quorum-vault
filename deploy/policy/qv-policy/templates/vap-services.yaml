apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qv-services
  labels: {{- include "qvp.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - reason: Forbidden
      message: "Services of type NodePort are not allowed"
      expression: |-
        !has(object.spec.type) || object.spec.type != 'NodePort'
    - reason: Forbidden
      message: "a LoadBalancer Service needs the annotation quorumvault.io/endpoint: private (a private endpoint, never a public load balancer)"
      expression: |-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer' || (has(object.metadata.annotations) && 'quorumvault.io/endpoint' in object.metadata.annotations && object.metadata.annotations['quorumvault.io/endpoint'] == 'private')
    - reason: Forbidden
      message: "externalIPs are not allowed"
      expression: |-
        !has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0
---
{{ include "qvp.binding" (dict "ctx" . "name" "qv-services") }}
