{{- include "qvs.validate" . -}}
# Plain configuration only. Every ConfigMap is immutable and its name carries a hash of its content: a change is a new ConfigMap, a new pod template and a new
# rollout, never an edit in place. No secret is ever rendered into a ConfigMap: certificates, the HSM PIN and tokens are Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qvs.cmName" (dict "ctx" . "c" "gateway-env" "data" (include "qvs.gatewayEnv" .)) }}
  labels: {{- include "qvs.labels" (dict "ctx" . "c" "gateway") | nindent 4 }}
immutable: true
data:
  {{- include "qvs.gatewayEnv" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qvs.signingConfigName" . }}
  labels: {{- include "qvs.labels" (dict "ctx" . "c" "gateway") | nindent 4 }}
immutable: true
data:
  config.json: {{ include "qvs.signingConfig" . | quote }}
{{- if and (eq .Values.hsm.mode "pkcs11") .Values.hsm.pkcs11.clientConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qvs.cmName" (dict "ctx" . "c" "hsm-client" "data" (toJson .Values.hsm.pkcs11.clientConfig)) }}
  labels: {{- include "qvs.labels" (dict "ctx" . "c" "gateway") | nindent 4 }}
immutable: true
data: {{- toYaml .Values.hsm.pkcs11.clientConfig | nindent 2 }}
{{- end }}
{{- if .Values.metrics.agent.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qvs.cmName" (dict "ctx" . "c" "agent" "data" (include "qvs.agentConfig" .)) }}
  labels: {{- include "qvs.labels" (dict "ctx" . "c" "gateway") | nindent 4 }}
immutable: true
data:
  config.alloy: {{ include "qvs.agentConfig" . | quote }}
{{- end }}
