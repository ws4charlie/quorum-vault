{{- with .Values.signedSettings.job }}
{{- if .enabled }}
{{- /* An operator-run Job: ONE of the four signed-setting tools, with the signed change files from a ConfigMap. OFF by default. No key is mounted: signing happens on the operators' machines. */}}
{{- if not (has .tool (list "route" "fee-caps" "approvers" "keysets")) }}{{ fail "signedSettings.job.tool must be route, fee-caps, approvers or keysets" }}{{ end }}
{{- if not (has .action (list "show" "apply")) }}{{ fail "signedSettings.job.action must be show or apply (sign belongs on the operator's machine)" }}{{ end }}
{{- if and .configMap (not (regexMatch "^.+-[0-9a-f]{10}$" .configMap)) }}{{ fail "signedSettings.job.configMap must end in a hash of its content (-<10 hex>) and be created immutable: README \"Signed settings\" step 2. The cluster policy refuses any other ConfigMap" }}{{ end }}
{{- $name := printf "%s-%s-%s-%s" $.Release.Name .action .tool .revision | trunc 63 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels: {{- include "qvs.labels" (dict "ctx" $ "c" "tools") | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "qvs.labels" (dict "ctx" $ "c" "tools") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "qvs.fullname" (dict "ctx" $ "c" "gateway") }}
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext: {{- include "qvs.podSecurityContext" $ | nindent 8 }}
      {{- include "qvs.pullSecrets" $ | nindent 6 }}
      containers:
        - name: {{ .action }}
          image: {{ include "qvs.image" (dict "ctx" $ "k" "tools") | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [{{ printf "/usr/local/bin/qv-%s" .tool | quote }}]
          args:
            - {{ .action }}
            - -config
            - /etc/qv/config/config.json
            {{- if eq .action "apply" }}
            {{- range .extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- range .files }}
            - {{ printf "/etc/qv/signed/%s" . | quote }}
            {{- end }}
            {{- else }}
            {{- range .extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          env:
            - { name: QV_GATEWAY_GUARD_DSN, value: {{ include "qvs.guardDSN" $ | quote }} }
          resources: {{- toYaml .resources | nindent 12 }}
          securityContext: {{- include "qvs.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /etc/qv/tls, readOnly: true }
            - { name: config, mountPath: /etc/qv/config, readOnly: true }
            - { name: signed, mountPath: /etc/qv/signed, readOnly: true }
      volumes:
        {{- include "qvs.secretVolume" (dict "name" "tls" "secret" $.Values.tls.gateway.secretName "trust" $.Values.tls.trust.signing) | nindent 8 }}
        - name: config
          configMap: { name: {{ include "qvs.signingConfigName" $ }} }
        - name: signed
          configMap: { name: {{ required "signedSettings.job.configMap is required: the ConfigMap that holds the signed change files" .configMap | quote }} }
{{- end }}
{{- end }}
