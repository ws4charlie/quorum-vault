{{- include "qm.guards" . -}}
{{- /* The business cluster only: scrape the metrics Services of the business chart. The business chart's NetworkPolicy lets the monitoring namespace in and nothing else. */ -}}
{{- if and .Values.serviceMonitors.enabled (eq .Values.clusterKind "business") }}
{{- $s := .Values.serviceMonitors }}
{{- range $c := $s.components }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "qv-%s" $c }}
  labels:
    {{- include "qm.labels" $ | nindent 4 }}
    {{- with $s.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  namespaceSelector:
    matchNames: [{{ $s.businessNamespace | quote }}]
  selector:
    matchLabels:
      quorumvault.io/metrics: "true"
      app.kubernetes.io/component: {{ $c | quote }}
  endpoints:
    - port: metrics
      interval: {{ $s.interval | quote }}
      scheme: http
      relabelings:
        - { action: replace, targetLabel: job, replacement: {{ printf "qv-%s" $c | quote }} }
        - { action: replace, targetLabel: qv_cluster, replacement: {{ $s.clusterLabel | quote }} }
---
{{- end }}
{{- end }}
