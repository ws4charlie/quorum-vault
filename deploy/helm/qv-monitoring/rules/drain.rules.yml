# Refused drains in the signing zone (docs/runbooks/key-replacement.md). A drain moves funds from a replaced key to its successor; the zone refuses one that does not match its own view.
# Refusals use up neither the drain rate nor the cap, so a repeating one is a stuck planner or the business zone probing: it must be visible.
#
#   qv_drain_refusals_total{mode="gateway"|"cosigner", chain, reason}   counter since process start (internal/gateway/drainmetrics.go).
# The gateway writes it to its textfile (<mpc-metrics-file>-drain.prom), the cosigner serves it on its metrics port. Every label combination (the config's chains,
# a fixed set of reason classes) is published at 0 from the first scrape, so a first refusal is an increase and a bare increase() sees it.
groups:
  - name: qv-drain
    rules:
      - alert: QVDrainRefused
        expr: sum by (mode, chain) (increase(qv_drain_refusals_total[15m])) > 0
        labels: {severity: page}
        annotations:
          summary: "The signing zone refused a drain on {{ $labels.chain }} ({{ $labels.mode }})"
          description: "The ALERT line 'drain refused' in the {{ $labels.mode }} log has the intent, the source and the reason (the reason label says the class). Repeated refusals: a stuck planner, or the business zone probing. Runbook: docs/runbooks/key-replacement.md"
