# qv-monitoring: which cluster this release is for decides what it renders.
#   central  - where the rules are evaluated (the central monitoring cluster, outside every signing cluster): PrometheusRule objects, and the AlertmanagerConfig if enabled.
#   business - the business cluster: ServiceMonitor objects for core, worker, relay and archiver (the business chart's metrics Services, qv-business `metrics.enabled`).
#   signing  - a signing cluster (signing-core, party B, party C): renders NOTHING. Metrics leave these clusters only through the agent sidecar of qv-signing-core and qv-party,
#              which remote-writes outward; no scrape object or inbound rule may exist there. The chart refuses values that would add one.
clusterKind: central

# PrometheusRule objects, one per file of monitoring/*.rules.yml (copies in rules/, generated by ci/helm/sync-monitoring-rules.sh; a test fails on drift).
rules:
  enabled: true
  labels: {}                    # what your Prometheus ruleSelector matches, e.g. { release: kube-prometheus-stack }

# ServiceMonitors (clusterKind business). Needs the Prometheus Operator CRDs. Without the operator, scrape the same Services with kubernetes_sd_configs (README).
serviceMonitors:
  enabled: true
  labels: {}                    # what your Prometheus serviceMonitorSelector matches
  businessNamespace: qv         # where the qv-business release runs
  clusterLabel: business        # added to every series as qv_cluster
  interval: 30s
  components: [core, worker, relay, archiver]

# A routing example for Alertmanager (AlertmanagerConfig, clusterKind central). Off by default. Placeholders only: receivers name Secrets, no URL or key is in values.
# A party's alerts (label `party`) go to that party's operators; everything else goes to the default receiver.
alertmanager:
  enabled: false
  labels: {}
  defaultReceiver: central-sre
  groupBy: [alertname, party]
  receivers:
    - { name: central-sre,        webhookUrlSecret: { name: qv-alert-central-sre, key: url } }
    - { name: party-a-operators,  webhookUrlSecret: { name: qv-alert-party-a, key: url } }
    - { name: party-b-operators,  webhookUrlSecret: { name: qv-alert-party-b, key: url } }
    - { name: party-c-operators,  webhookUrlSecret: { name: qv-alert-party-c, key: url } }
  partyRoutes:
    - { party: "A", receiver: party-a-operators }
    - { party: "B", receiver: party-b-operators }
    - { party: "C", receiver: party-c-operators }
