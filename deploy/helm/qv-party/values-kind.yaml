# Local kind cluster. Only configuration differs from production: -dev images by tag, SoftHSM on the data volume (QV_ENV=dev, token made by an init container),
# plain ReadWriteOnce storage (kind's provisioner has no ReadWriteOncePod), small requests, ClusterIP services, peers are pods of the same cluster.
imagePullPolicy: IfNotPresent
images:
  party:    { digest: "", tag: local, repository: qv-image/mpc-party-dev }
  cosigner: { digest: "", tag: local, repository: qv-image/qv-cosigner-dev }
  tools:    { digest: "", tag: local, repository: qv-image/qv-tools-signing }
sealer: { type: pkcs11 }
hsm:
  provider: softhsm
  module: { path: /usr/lib/softhsm/libsofthsm2.so }
  softhsm: { enabled: true }
persistence: { size: 1Gi, accessModes: [ReadWriteOnce] }
party:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
cosigner:
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
limits: { shutdownGraceMs: 5000 }
