{{- range $c := list "core" "worker" "relay" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qv.fullname" (dict "ctx" $ "c" $c) }}
  labels: {{- include "qv.labels" (dict "ctx" $ "c" $c) | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.archiver.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qv.fullname" (dict "ctx" . "c" "archiver") }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "archiver") | nindent 4 }}
  {{- with .Values.archiver.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.archiver.serviceAccount.automountToken }}
{{- end }}
{{- if .Values.approval.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qv.fullname" (dict "ctx" . "c" "approval") }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "approval") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
