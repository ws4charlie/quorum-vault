# Plain configuration only. Every ConfigMap is immutable and its name carries a hash of its content (the policy chart's rule, as the signing-core and party charts): a change is a new
# ConfigMap, a new pod template and a rollout, never an edit in place.
# No secret is ever rendered into a ConfigMap: certificates, keys and the custody config are Secret volumes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qv.cmName" (dict "ctx" . "c" "core-env" "data" (include "qv.env.core" .)) }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "core") | nindent 4 }}
immutable: true
data:
  {{- include "qv.env.core" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qv.cmName" (dict "ctx" . "c" "worker-env" "data" (include "qv.env.worker" .)) }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "worker") | nindent 4 }}
immutable: true
data:
  {{- include "qv.env.worker" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qv.cmName" (dict "ctx" . "c" "relay-env" "data" (include "qv.env.relay" .)) }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "relay") | nindent 4 }}
immutable: true
data:
  {{- include "qv.env.relay" . | nindent 2 }}
{{- if .Values.archiver.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qv.cmName" (dict "ctx" . "c" "archiver-env" "data" (include "qv.env.archiver" .)) }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "archiver") | nindent 4 }}
immutable: true
data:
  {{- include "qv.env.archiver" . | nindent 2 }}
{{- end }}
{{- if .Values.approval.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qv.cmName" (dict "ctx" . "c" "approval-env" "data" (include "qv.env.approval" .)) }}
  labels: {{- include "qv.labels" (dict "ctx" . "c" "approval") | nindent 4 }}
immutable: true
data:
  {{- include "qv.env.approval" . | nindent 2 }}
{{- end }}
