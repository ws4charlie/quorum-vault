{{- $core := include "qv.fullname" (dict "ctx" . "c" "core") }}
{{- if .Values.ingress.public.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $core }}-public
  labels: {{- include "qv.labels" (dict "ctx" . "c" "core") | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.public.className "nginx" }}
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace .Values.tls.core.secretName | quote }}
    {{- end }}
    {{- range $k, $v := .Values.ingress.public.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.public.className }}
  tls:
    - hosts: [{{ .Values.ingress.public.host | quote }}]
      secretName: {{ .Values.ingress.public.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.public.host | quote }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: {{ $core }}, port: { name: https } } } }
{{- end }}
{{- if .Values.ingress.passthrough.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $core }}-passthrough
  labels: {{- include "qv.labels" (dict "ctx" . "c" "core") | nindent 4 }}
  annotations:
    {{- range $k, $v := .Values.ingress.passthrough.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.passthrough.className }}
  rules:
    - host: {{ .Values.ingress.passthrough.host | quote }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: {{ $core }}, port: { name: https } } } }
{{- end }}
