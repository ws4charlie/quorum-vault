# The gate in front of the Temporal frontend: TLS with a client certificate of the business authority, and a list of the NAMES that may call (Temporal itself checks
# only the authority). It is a plain TCP/TLS proxy: the frontend sits behind it on the compose network, with no published port, and the gate calls it with
# its own certificate. A name that is not on the list gets a connection that is closed at once. The names are the certificates' common names (service names).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
stream {
    log_format gate '$time_iso8601 $remote_addr client="$ssl_client_s_dn" -> $temporal_upstream';
    access_log /dev/stdout gate;
    map $ssl_client_s_dn $temporal_upstream {
        default     refused;
        "CN=worker" frontend;
        "CN=core"   frontend;
        "CN=admin"  frontend;   # operators and tests
    }
    upstream frontend { server temporal:7233; }
    upstream refused  { server 127.0.0.1:9; } # nothing listens there

    server {
        listen 7233 ssl;
        ssl_certificate         /pki/tls.crt;
        ssl_certificate_key     /pki/tls.key;
        ssl_client_certificate  /pki/ca.crt;
        ssl_verify_client       on;
        ssl_protocols           TLSv1.3;
        ssl_alpn                h2;   # gRPC clients insist on it

        proxy_pass              $temporal_upstream;
        proxy_ssl               on;
        proxy_ssl_certificate         /pki/tls.crt;
        proxy_ssl_certificate_key     /pki/tls.key;
        proxy_ssl_trusted_certificate /pki/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                temporal;
        proxy_ssl_protocols           TLSv1.3;
    }
}
