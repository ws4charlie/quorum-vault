# The certificate's common name (the service name in its spiffe URI) -> the database role it may be. A name not listed here is refused, whatever authority signed it.
# gateway-link: the one visitor from the signing zone, a certificate the BUSINESS authority issued to it; it may only be the restricted role.
qv core qv
qv worker qv
qv relay qv
qv archiver qv
qv admin qv
qv gateway-link qv_gateway
