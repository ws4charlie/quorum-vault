# The certificate's common name (the service name in its spiffe URI) -> the database role it may be. A name not listed here is refused, whatever authority signed it.
# One role per service, with only the rights that service uses (migration 0030_service_roles.sql); the DSN user of a service must be its own role.
# gateway-link: the one visitor from the signing zone, a certificate the BUSINESS authority issued to it; it may only be the restricted role.
# migrator: the migration Job (`qv-migrate`) on Kubernetes; admin: operators and the tests (and `qv-migrate` in the compose stack). These two are the only identities that are the owner role (they create and alter the schema).
# archiver reads Kafka and writes an archive store and never connects to this database; its role has no rights, so its certificate opens nothing.
qv core qv_core
qv worker qv_worker
qv relay qv_relay
qv archiver qv_archiver
qv admin qv
qv migrator qv
qv gateway-link qv_gateway
