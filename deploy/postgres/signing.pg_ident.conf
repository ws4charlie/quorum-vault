# Signing zone: each service is its own role, and each role owns only its own replay-guard database (deploy/postgres/signing_roles.sql).
# The gateway and the cosigner apply their schema at start, so their role owns its guard database and may alter it; CONNECT on each guard
# database is revoked from PUBLIC, so neither can open the other's. Each cosigner has its own certificate name (cosigner-b, cosigner-c) and its own role, so C's certificate cannot open B's guard database.
# admin: operators and the tests, the owner role (it creates the guard databases).
qv gateway qv_gateway_guard
qv cosigner-b qv_cosigner_b_guard
qv cosigner-c qv_cosigner_c_guard
qv admin qv
