name: mpc-env
description: >
  Everything an end-to-end job needs besides the checkout: the CI image (clang-20, cb-mpc, SoftHSM2, Go; see ci/qv-ci.Dockerfile), the SoftHSM
  tokens (quorumvault, qv-party-1, qv-party-2, qv-party-3, qv-cold), and the services the tests talk to. The services start in the background first, the
  other set-up runs meanwhile, and the action waits for them last, so the tests start as soon as everything is ready. The calling job provides
  the Postgres service and checks the repository out, and runs its tests with ci/run-in-image.sh.
inputs:
  infra:
    description: "'true' also starts Temporal and Redpanda (the custody tests need them)"
    default: "false"
  anvil:
    description: "'true' starts anvil (chain id 11155111, port 18545): the EVM tests and the signing test. The Bitcoin jobs turn it off."
    default: "true"
  bitcoind:
    description: "'true' starts bitcoind in regtest on 18443 (the Bitcoin jobs)"
    default: "false"
  solana:
    description: "'true' starts solana-test-validator on 18899, built from ci/solana (the Solana jobs)"
    default: "false"
  postgres:
    description: "'true' starts the business Postgres (55432) and the signing zone's Postgres (55433), TLS with client certificates only, from the certificates made here"
    default: "false"
  keycloak:
    description: "'true' starts the dev Keycloak on 8180 with the realm in deploy/keycloak (the identity job)"
    default: "false"
  go-cache:
    description: "the family of jobs that share a Go build cache (they compile the same packages): custody, btc, sol or mpc. Another name restores the newest cache of any family."
    default: "e2e"
runs:
  using: composite
  steps:
    # The Solana validator image is pulled from ghcr (it may be a private package), so log in before the services start.
    - name: Log in to ghcr.io
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "no login, pulling anonymously"
    - name: Pull the CI image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "no login: pulling anonymously"
        ci/ensure-image.sh use
    # Go modules and the build cache, in the directory ci/run-in-image.sh mounts: restored from the newest run of main for this family of jobs (keyed on the
    # dependencies and the commit), and saved only by pushes to main (actions/cache saves at the end of a successful job). A key on go.sum alone was written
    # once and never again, so every job compiled every package changed since (one to two minutes a job). Pull requests only restore: their caches would
    # crowd main's out of the repository's 10 GB.
    - name: Restore the Go module and build cache, and save it at the end (pushes to main)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/qv-go
        key: qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-${{ github.sha }}
        restore-keys: |
          qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-
          qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-
          qv-go-
    - name: Restore the Go module and build cache
      if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/qv-go
        key: qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-${{ github.sha }}
        restore-keys: |
          qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-
          qv-go-${{ inputs.go-cache }}-${{ runner.os }}-${{ runner.arch }}-
          qv-go-
    # One private CA per trust zone and a short-lived certificate for every service, made fresh for this job (nothing is committed). They come before the services
    # start: the Postgres containers read theirs from data/pki.
    - name: Make the TLS certificates (scripts/pki.sh)
      shell: bash
      run: |
        ci/run-in-image.sh ./scripts/pki.sh
        echo "QV_PKI_DIR=$GITHUB_WORKSPACE/data/pki" >> "$GITHUB_ENV"
    - name: Start the services in the background
      shell: bash
      env:
        INFRA: ${{ inputs.infra }}
        ANVIL: ${{ inputs.anvil }}
        BITCOIND: ${{ inputs.bitcoind }}
        SOLANA: ${{ inputs.solana }}
        KEYCLOAK: ${{ inputs.keycloak }}
        POSTGRES: ${{ inputs.postgres }}
      run: |
        flags=()
        [ "$ANVIL" = true ] && flags+=(--anvil)
        [ "$INFRA" = true ] && flags+=(--infra)
        [ "$BITCOIND" = true ] && flags+=(--bitcoind)
        [ "$SOLANA" = true ] && flags+=(--solana)
        [ "$KEYCLOAK" = true ] && flags+=(--keycloak)
        [ "$POSTGRES" = true ] && flags+=(--postgres)
        ci/infra.sh start "${flags[@]}"
    - name: Generate the PINs (.env) and create the SoftHSM2 tokens (quorumvault, qv-party-1, qv-party-2, qv-party-3, qv-cold)
      shell: bash
      run: |
        ./scripts/dev-env.sh
        ci/run-in-image.sh ./scripts/setup-softhsm.sh
    - name: Wait for the services
      shell: bash
      run: ci/infra.sh wait
