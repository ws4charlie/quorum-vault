name: mpc-env
description: >
  Everything an end-to-end job needs besides the checkout: the CI image (clang-20, cb-mpc, SoftHSM2, Go; see ci/qv-ci.Dockerfile), the SoftHSM
  tokens (quorumvault, qv-party-1, qv-party-2, qv-party-3, qv-cold), and the services the tests talk to. The services start in the background first, the
  other set-up runs meanwhile, and the action waits for them last, so the tests start as soon as everything is ready. The calling job provides
  the Postgres service and checks the repository out, and runs its tests with ci/run-in-image.sh.
inputs:
  infra:
    description: "'true' also starts Temporal and Redpanda (the custody tests need them)"
    default: "false"
  anvil:
    description: "'true' starts anvil (chain id 11155111, port 18545): the EVM tests and the signing test. The Bitcoin jobs turn it off."
    default: "true"
  bitcoind:
    description: "'true' starts bitcoind in regtest on 18443 (the Bitcoin jobs)"
    default: "false"
  solana:
    description: "'true' starts solana-test-validator on 18899, built from ci/solana (the Solana jobs)"
    default: "false"
runs:
  using: composite
  steps:
    # The Solana validator image is pulled from ghcr (it may be a private package), so log in before the services start.
    - name: Log in to ghcr.io
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "no login, pulling anonymously"
    - name: Start the services in the background
      shell: bash
      env:
        INFRA: ${{ inputs.infra }}
        ANVIL: ${{ inputs.anvil }}
        BITCOIND: ${{ inputs.bitcoind }}
        SOLANA: ${{ inputs.solana }}
      run: |
        flags=()
        [ "$ANVIL" = true ] && flags+=(--anvil)
        [ "$INFRA" = true ] && flags+=(--infra)
        [ "$BITCOIND" = true ] && flags+=(--bitcoind)
        [ "$SOLANA" = true ] && flags+=(--solana)
        ci/infra.sh start "${flags[@]}"
    - name: Pull the CI image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "no login: pulling anonymously"
        ci/ensure-image.sh use
    # Go modules and the build cache, in the directory ci/run-in-image.sh mounts. Keyed on the dependencies, as setup-go did.
    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/qv-go
        key: qv-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: qv-go-${{ runner.os }}-${{ runner.arch }}-
    - name: Generate the PINs (.env) and create the SoftHSM2 tokens (quorumvault, qv-party-1, qv-party-2, qv-party-3, qv-cold)
      shell: bash
      run: |
        ./scripts/dev-env.sh
        ci/run-in-image.sh ./scripts/setup-softhsm.sh
    - name: Wait for the services
      shell: bash
      run: ci/infra.sh wait
