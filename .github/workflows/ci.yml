  # of the chromedp project, pinned by digest (Chromium 159, as of 2026-11-19), run on the host network next to the job; the tests drive it over its
  # DevTools port (QV_E2E_CHROME_URL), so the CI image needs no browser. It ignores certificate errors only because the dev Keycloak and the core use the
  # test authority's certificates.
  e2e-approval-web:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
