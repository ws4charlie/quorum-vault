  # The small groups of e2e/custody and x402 in one job (each alone took about three minutes, two of them set-up and compiling the same packages). Each step
  # keeps the environment and the time limit its job had; a failed step does not stop the next ones.
  #   x402        on a local Base Sepolia: the EIP-3009 signing kind against a token on the lane's anvil (the tests set its chain id to 84532 and set it
  #               back), the HSM, and the core's liability accounting through the real chain reader (docs/evm.md, "x402 authorizations")
  #   identity    a two-approver withdrawal with tokens from the dev Keycloak
  #   gate        the GATE-CONNECT demo: AgentGate's signing API through the real zone with the two-party MPC signer, on the lane's anvil as Base Sepolia
  #   approval    the approval page (web/approval) in a real browser with a virtual passkey (SIMULATED: no hardware, no person). The browser is the
  #               headless-shell image of the chromedp project, pinned by digest (Chromium 159, as of 2026-11-19), on the host network next to the job; the
  #               tests drive it over its DevTools port (QV_E2E_CHROME_URL), so the CI image needs no browser. It ignores certificate errors only because
  #               the dev Keycloak and the core use the test authority's certificates.
  #   load smoke  the load test's smoke scenario (loadtest/README.md): a handful of operations through the real stack, correctness checks only
  e2e-evm-misc:
    name: e2e-evm-misc (x402, identity, gate, approval page, load smoke)
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',e2e-evm-misc,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
    steps:
      - uses: actions/checkout@v4
      - name: Start the headless browser (pinned image)
        run: |
          docker run -d --name chrome --network host chromedp/headless-shell@sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9 --ignore-certificate-errors
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/version && exit 0; sleep 1; done
          docker logs chrome; exit 1
      - uses: ./.github/actions/mpc-env
        id: env
        with:
          postgres: "true"
          infra: "true"
          keycloak: "true"
          go-cache: custody
      - name: make test-e2e-x402
