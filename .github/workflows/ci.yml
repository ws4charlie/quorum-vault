      QV_E2E_TESTBIN: ${{ github.workspace }}/.ci-prebuilt/test
      QV_GOTEST: ci/gotest.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
      - name: Unpack the prebuilt binaries
        run: tar -xf prebuilt.tar && rm prebuilt.tar
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: build
          postgres: "true"
          infra: "true"
      - name: recovery, drill
        run: |
          ci/run-groups.sh \
            'recovery|15|QV_E2E_TIMEOUT_SCALE=3 make test-e2e-evm-recovery' \
            'drill|15|QV_E2E_TIMEOUT_SCALE=3 make test-e2e-evm-drill'

  # approval page: web/approval in a real browser with a virtual passkey (SIMULATED: no hardware, no person). The browser is the headless-shell image of the
  # chromedp project, pinned by digest (Chromium 159, as of 2026-11-19), on the host network next to the job; the tests drive it over its DevTools port, so
  # the CI image needs no browser. It ignores certificate errors only because the dev Keycloak and the core use the test authority's certificates.
  # x402: the EIP-3009 signing kind against a token on the lane's anvil (the tests set its chain id to 84532 and set it back), the HSM, the liability booking.
  e2e-evm-3:
    name: e2e-evm-3 (approval page, identity, tx-failures, gate, x402)
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',e2e-evm-3,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 95
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
      # the prebuilt binaries of the build job (e2e/mpcstack.GoBuild, ci/gotest.sh); a binary missing there is an error, not a silent compile
      QV_E2E_PREBUILT: ${{ github.workspace }}/.ci-prebuilt/bin
      QV_E2E_PREBUILT_STRICT: "1"
      QV_E2E_TESTBIN: ${{ github.workspace }}/.ci-prebuilt/test
      QV_GOTEST: ci/gotest.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
      - name: Unpack the prebuilt binaries
        run: tar -xf prebuilt.tar && rm prebuilt.tar
      - name: Start the headless browser (pinned image)
        run: |
          docker run -d --name chrome --network host chromedp/headless-shell@sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9 --ignore-certificate-errors
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/version && exit 0; sleep 1; done
          docker logs chrome; exit 1
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: build
          postgres: "true"
          infra: "true"
          keycloak: "true"
      - name: approval page, identity, tx-failures, gate, x402
        run: |
          ci/run-groups.sh \
            'approval page|20|QV_REQUIRE_BROWSER=1 QV_E2E_TIMEOUT_SCALE=3 QV_E2E_KEYCLOAK_URL=https://127.0.0.1:8180 QV_E2E_CHROME_URL=http://127.0.0.1:9222 make test-e2e-approval-web' \
            'identity|15|QV_E2E_TIMEOUT_SCALE=3 QV_E2E_KEYCLOAK_URL=https://127.0.0.1:8180 make test-e2e-evm-identity' \
            'tx-failures|15|QV_E2E_TIMEOUT_SCALE=3 make test-e2e-evm-tx-failures' \
            'gate|15|QV_E2E_TIMEOUT_SCALE=3 make test-e2e-evm-gate' \
            'x402|15|make test-e2e-x402'


  e2e-evm-4:
    name: e2e-evm-4 (mpc-signing, tee-sim, load smoke)
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',e2e-evm-4,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 70
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
      # the prebuilt binaries of the build job (e2e/mpcstack.GoBuild, ci/gotest.sh); a binary missing there is an error, not a silent compile
      QV_E2E_PREBUILT: ${{ github.workspace }}/.ci-prebuilt/bin
      QV_E2E_PREBUILT_STRICT: "1"
      QV_E2E_TESTBIN: ${{ github.workspace }}/.ci-prebuilt/test
      QV_GOTEST: ci/gotest.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
      - name: Unpack the prebuilt binaries
        run: tar -xf prebuilt.tar && rm prebuilt.tar
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: build
          postgres: "true"
          infra: "true"
      - name: mpc-signing, tee-sim, load smoke
        run: |
          ci/run-groups.sh \
            'mpc-signing|15|make test-mpc' \
            'tee-sim|25|QV_E2E_TIMEOUT_SCALE=3 make test-e2e-tee-sim' \
            'load smoke|15|QV_E2E_TIMEOUT_SCALE=3 make load-smoke'
