name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # The CI image (ci/qv-ci.Dockerfile): clang-20, cb-mpc, SoftHSM2 and Go, tagged by a hash of its inputs (ci/image-tag.sh). Almost always the tag
  # exists already and this job is a no-op of a few seconds; when an input changed it builds the image and pushes it, and the jobs below wait for it.
  # Fork pull requests cannot push: their jobs pull the tag if main has it, else build it themselves (ci/ensure-image.sh use).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
            mpc-party/scripts
            mpc-party/cbmpc.pin
            mpc-party/go.mod
            mpc-party/api/go.mod
            go.mod
          sparse-checkout-cone-mode: false
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image if its tag does not exist
        env:
          QV_CI_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: ci/ensure-image.sh publish

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorumvault
          POSTGRES_USER: qv
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qv -d quorumvault"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=disable
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Set up tokens
        run: ./scripts/setup-softhsm.sh
      - run: go vet ./...
      # -p 1: test binaries share the SoftHSM token files; a process that
      # C_Initialize's while another writes a token object can miss that
      # token for its whole lifetime (seen as "token not found").
      - run: go test -short -count=1 -p 1 ./...

  # cb-mpc wrapper (C++ via cgo). Separate Go module in mpc-party/: the jobs above never see C++.
  # Same commands as mpc-party/scripts/ci.sh (which can be run in a linux/amd64 container).
  mpc-party:
    # Pinned: ubuntu-latest moved to a release that apt.llvm.org has no clang-20 repository for.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mpc-party/go.mod
      - name: Install C++ toolchain
        run: mpc-party/scripts/install-toolchain-linux.sh
      # The sealer tests and the restore drill use SoftHSM tokens qv-party-1, qv-party-2 and qv-party-3 (party C).
      - name: Install SoftHSM2 and create the tokens
        run: |
          sudo apt-get install -y softhsm2
          ./scripts/setup-softhsm.sh
      # Key: pinned cb-mpc commit + build script. Changing either rebuilds OpenSSL and the library (about 2 minutes).
      - name: Cache cb-mpc build
        uses: actions/cache@v4
        with:
          path: mpc-party/.deps
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mpc-party/cbmpc.pin', 'mpc-party/scripts/fetch-build-cbmpc.sh') }}
      - name: Build cb-mpc at the pinned commit
        run: mpc-party/scripts/fetch-build-cbmpc.sh
      # Pure-Go API module (generated gRPC code): no cgo, no cb-mpc, no go-ethereum.
      - name: mpc-party/api vet, build, test
        working-directory: mpc-party/api
        run: |
          go vet ./...
          go build ./...
          go test -count=1 ./...
          ! go list -deps ./... | grep -E 'go-ethereum|cb-mpc/internal'
      - name: go vet
        working-directory: mpc-party
        run: go vet ./...
      # Includes the service (internal/server), the real-process tests (e2e: separate binaries, generated certificates,
      # kill/hang/drop tests, throughput) and the wrapper tests. The prod binary is built without -tags devauth.
      - name: go build service (production tags)
        working-directory: mpc-party
        run: go build -o /dev/null ./cmd/mpc-party
      - name: go test -race
        working-directory: mpc-party
        env:
          QV_REQUIRE_HSM: "1"
        run: go test -race -count=1 -timeout 25m ./...
      # Destroys party B in a local stack, restores it from its backup, signs. About 10 s.
      - name: Restore drill
        working-directory: mpc-party
        run: scripts/restore-drill.sh
      - name: Fuzz entry points (short)
        working-directory: mpc-party
        run: go test -run '^$' -fuzz FuzzEntryPoints -fuzztime 30s ./internal/cbmpc

  # The two-party MPC signer and the custody system on it, in parallel jobs (each with its own runner, Postgres, anvil, and for
  # the custody ones Temporal and Redpanda), so a pull request waits for the slowest group, not for the sum. The heavy tests
  # (every crash boundary, kill at each custody boundary, freeze, link failures) run nightly: .github/workflows/nightly.yml.
  # See the Makefile for what is in each group. None of these is a required check; `test` is.

  mpc-signing:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorumvault
          POSTGRES_USER: qv
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qv -d quorumvault"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=disable
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          infra: "false"
      - name: make test-mpc
        run: ci/run-in-image.sh make test-mpc

  e2e-evm-flows:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorumvault
          POSTGRES_USER: qv
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qv -d quorumvault"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=disable
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
      # A shared runner is slower than a laptop: every condition wait in the custody tests gets three times as long.
      QV_E2E_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          infra: "true"
      - name: make test-e2e-evm-flows
        run: ci/run-in-image.sh make test-e2e-evm-flows

