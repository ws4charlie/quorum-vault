        with:
          infra: "true"
      - name: make test-e2e-evm-recovery
        run: ci/run-in-image.sh make test-e2e-evm-recovery

  # Bitcoin cell, deposits: bitcoind in regtest, real mpc-party. The cb-mpc build cache is shared through the mpc-env action.
