name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run, so superseded runs do not hold runners. Pushes to main and dev are never
# cancelled: every commit there keeps its own full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs run. Never skipped, never needs anything. The human's rule, which every line below serves: "Make sure that changing related code can never
  # accidentally skip a CI job that should run. Better to run too much than to miss a run."
  # Two decisions, both for pull requests only:
  #   skip       every heavy job (`image` and everything that needs it, and the steps of `test`) is skipped when EVERY changed file is on the allowlist
  #              ci/skip-allowlist (documentation, three Helm charts and their test trees: files no job reads, with the evidence in CONTRIBUTING.md).
  #   skip_jobs  otherwise, the jobs that no changed file can affect (",job,job,"): ci/jobselect works it out from the Go package graph (`go list` of
  #              every module, every build tag CI uses) and ci/jobs (the packages each job tests); a non-Go file affects only the readers of its tree
  #              (ci/job-rules), anything else every job. Each job below is skipped only by its own id in this list.
  # A file on no list, a rename, a mode change, a symlink, a push, a manual or merge-queue run, an error of the classifier or the selector, a change to
  # either, to their lists or to this file: everything runs. Only the exact output `true` or a clean list skips; an empty or missing output (the job
  # failed, timed out or was cancelled) runs everything. The tests of both and their guards (ci/skip-guard.sh, `jobselect check`, the split check) run
  # here on every run. To force a full run on a pull request: a commit message with [ci full] (CONTRIBUTING.md).
  # A new job: ci/jobselect check fails until it is in ci/jobs with the condition naming its own id (CONTRIBUTING.md, "Which jobs run").
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # Published by the LAST step only, which runs only when every earlier step succeeded (a failed guard or test leaves these empty) and then checks again
      # (ci/final.sh). Everything but the exact value `true` means: run everything.
      skip: ${{ steps.final.outputs.skip }}
      skip_jobs: ${{ steps.final.outputs.skip_jobs }}
      text: ${{ steps.final.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Go for the job selector: standard library only, and `go list` runs offline (GOPROXY=off), so no module cache is needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The guards run FIRST and are plain steps: if one fails, the job fails and nothing below publishes a skip.
      - name: Tests of the job selector
        id: t_select
        run: go test -count=1 ./ci/jobselect
      - name: The job selector's guard (ci/jobs, ci/job-rules and ci.yml agree)
        id: select_guard
        run: go run ./ci/jobselect check
      # The slowest groups run as two shards each: together exactly the group (Makefile test-e2e-<group>-1 and -2).
      - name: The shards of the split groups add up to the groups
        id: split
        run: ci/e2e-split-check.sh
      - name: Tests of the classifier
        id: t_changes
        run: ci/changes_test.sh
      - name: Tests of the allowlist guard
        id: t_guard
        run: ci/skip-guard_test.sh
      - name: The allowlist guard
        id: guard
        run: ci/skip-guard.sh
      # A build output or a huge file in git (a 29 MB Mach-O binary once got in with a feature PR): found by magic bytes and size, on every run.
      - name: Tests of the tracked-files check
        id: t_files
        run: ci/tracked-files_test.sh
      # The repeat-run loop (scripts/e2e-repeat.sh, CONTRIBUTING.md) counts passes from go test's output: a fake go checks it counts each kind of command right.
      - name: Test of the repeat-run script
        run: scripts/e2e-repeat_test.sh
      - name: No compiled binary or oversized file is tracked
        id: files
        run: ci/tracked-files.sh
      # Fails open by itself: its EXIT trap writes skip=false, and continue-on-error keeps even a crash from failing the job (the verdict is then not success).
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          QV_EVENT_NAME: ${{ github.event_name }}
          QV_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ci/changes.sh
      - name: Publish the decision
        id: final
        env:
          QV_CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          QV_CLASSIFY_SKIP: ${{ steps.classify.outputs.skip }}
          QV_CLASSIFY_SKIP_JOBS: ${{ steps.classify.outputs.skip_jobs }}
          QV_CLASSIFY_TEXT: ${{ steps.classify.outputs.text }}
          QV_GUARD_OUTCOMES: ${{ steps.t_select.outcome }} ${{ steps.select_guard.outcome }} ${{ steps.split.outcome }} ${{ steps.t_changes.outcome }} ${{ steps.t_guard.outcome }} ${{ steps.guard.outcome }} ${{ steps.t_files.outcome }} ${{ steps.files.outcome }}
        run: ci/final.sh

  # The CI image (ci/qv-ci.Dockerfile): clang-20, cb-mpc, SoftHSM2 and Go, tagged by a hash of its inputs (ci/image-tag.sh). Almost always the tag
  # exists already and this job is a no-op of a few seconds; when an input changed it builds the image and pushes it, and the jobs below wait for it.
  # Fork pull requests cannot push: their jobs pull the tag if main has it, else build it themselves (ci/ensure-image.sh use).
  image:
    needs: changes
    # a skipped `image` skips every job that needs it: only when everything is skipped, or no job that needs the image runs
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',image,'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
            mpc-party/scripts
            mpc-party/cbmpc.pin
            mpc-party/go.mod
            mpc-party/api/go.mod
            go.mod
          sparse-checkout-cone-mode: false
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image if its tag does not exist
        env:
          QV_CI_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: ci/ensure-image.sh publish
      - name: Build and push the Solana validator image if its tag does not exist
        env:
          QV_CI_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: ci/ensure-image.sh publish solana

  # `test` is the check branch protection requires, so it always ends (a job skipped by its own `if:` may leave a required check pending): on a skipped
  # run (everything skipped, or `test` in skip_jobs) its first step says so and the other steps do not run. It needs `changes` only for the answer; `!cancelled()` runs it even if `changes` failed.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
    steps:
      - name: "Skipped: nothing here reads the changed files"
        if: ${{ (needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        env:
          TEXT: ${{ needs.changes.outputs.text }}
        run: |
          echo "::notice title=test skipped::$TEXT"
          echo "### test: $TEXT" >> "$GITHUB_STEP_SUMMARY"
          echo "The tests did NOT run: no changed file is read by this job (ci/skip-allowlist, ci/jobselect; CONTRIBUTING.md). Add [ci full] to a commit message to run everything."
      - uses: actions/checkout@v4
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      - uses: actions/setup-go@v5
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        with:
          go-version-file: go.mod
          cache: false
      # The module and build caches: restored from the newest run of main (keyed on go.sum and the commit), saved only by pushes to main, so the build cache
      # follows the code (one keyed on go.sum alone was written once and then compiled every changed package again in every job).
      - name: Restore the Go module and build cache
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            qv-gotest-${{ runner.os }}-${{ runner.arch }}-
      - name: Install SoftHSM2
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      # one private CA per trust zone, fresh for this job, and the two Postgres servers (TLS, client certificates) that read them
      - name: Make the TLS certificates and start Postgres
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: |
          scripts/pki.sh
          ci/infra.sh start --postgres
          ci/infra.sh wait
      - name: Set up tokens
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: |
          ./scripts/dev-env.sh
          ./scripts/setup-softhsm.sh
      - run: go vet ./...
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      # -p 1: test binaries share the SoftHSM token files; a process that
      # C_Initialize's while another writes a token object can miss that
      # token for its whole lifetime (seen as "token not found").
      - run: go test -short -count=1 -p 1 ./...
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      - name: Save the Go module and build cache (pushes to main only)
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.head_ref == 'team/quorum-vault/ci-speed-2') }}  # TEMP (measurement)
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # cb-mpc wrapper (C++ via cgo). Separate Go module in mpc-party/: the jobs above never see C++.
  # The tests that were one `go test -race ./...` of one job run as five jobs, so the pull request waits for the slowest, not for the sum
  # (the e2e package alone was about 7 minutes): the same tests, the same flags. All of them run in the CI image (clang-20, cb-mpc, SoftHSM2, Go) like
  # the end-to-end jobs below; mpc-party/scripts/ci.sh is still the whole list of commands for one container.
  #   mpc-party-core      api module, vet, build, every package but e2e (internal/cbmpc about 2 minutes, internal/server)
  #   mpc-party-e2e-1..3  the real-process tests of mpc-party/e2e, split by test name (mpc-party/scripts/e2e-shard.sh: the pins and the check that
  #                       every test is in exactly one shard, which fails the job otherwise)
  #   mpc-party-drill     restore drill and the short fuzz run
  # The job names (`mpc-party / ...`) replace the one `mpc-party` job.
  mpc-party-core:
    name: mpc-party / core
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-core,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      # Pure-Go API module (generated gRPC code): no cgo, no cb-mpc, no go-ethereum.
      - name: mpc-party/api vet, build, test
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party/api && go vet ./... && go build ./... && go test -count=1 ./... && ! go list -deps ./... | grep -E "go-ethereum|cb-mpc/internal"'
      - name: go vet, go build service (production tags)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go vet ./... && go build -o /dev/null ./cmd/mpc-party'
      # Every package but e2e (a new package is in here by itself). The prod binary is built without -tags devauth.
      - name: go test -race (all packages but e2e)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go test -race -count=1 -timeout 25m $(go list ./... | grep -v "/e2e$")'
      # The simulated enclave (-tags teesim: mock attester and test root, never in a production build): verifier, broker, attested sealer, migration and the
      # crash matrices with attested parties. Needs the SoftHSM tokens (QV_REQUIRE_HSM: no silent skip).
      - name: go test -race -tags teesim (simulated enclave)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go test -race -count=1 -timeout 25m -tags teesim ./internal/attest/... ./cmd/qv-attest-broker/... && go test -race -count=1 -timeout 25m -tags teesim -run "TestAttested|TestMigration" ./internal/server && go test -race -count=1 -timeout 25m -tags teesim -run TestAttested ./e2e'

  # Three small groups in one job (each alone took one to three minutes, a third of it set-up): the mpc-party restore drill and short fuzz run, the
  # Prometheus rules of monitoring/ (promtool check rules, check config, the rule unit tests, the Go test that evaluates an alert on real counters; promtool
  # is pinned in the CI image and ci/promtool-tests.sh fails on a skipped test), and the audit-head archive against a real store in compliance mode
  # (SeaweedFS, started by the tests themselves from the digest in docker-compose.yml, through the Docker socket ci/run-in-image.sh passes) and a real Kafka
  # (Redpanda from ci/infra.sh). Each step keeps the environment and the time limit its job had; a failed step does not stop the next ones.
  misc-checks:
    name: misc-checks (mpc-party drill and fuzz, promtool rules, audit archive)
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',misc-checks,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        id: env
        with:
          postgres: "true"
          infra: "true"
          anvil: "false"
          go-cache: mpc
      - name: promtool checks and rule tests
        timeout-minutes: 25
        run: ci/run-in-image.sh ci/promtool-tests.sh
      # Destroys party B in a local stack, restores it from its backup, signs. About 10 s.
      - name: Restore drill
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        timeout-minutes: 15
        env:
          QV_REQUIRE_HSM: "1"
        run: ci/run-in-image.sh mpc-party/scripts/restore-drill.sh
      - name: Fuzz entry points (short)
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        timeout-minutes: 15
        env:
          QV_REQUIRE_HSM: "1"
        run: ci/run-in-image.sh bash -c 'cd mpc-party && go test -run "^\$" -fuzz FuzzEntryPoints -fuzztime 30s ./internal/cbmpc'
      - name: make test-archive
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        timeout-minutes: 15
        env:
          QV_REQUIRE_DB: "1"
        run: ci/run-in-image.sh make test-archive

  mpc-party-e2e-1:
    name: mpc-party / e2e-1
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-e2e-1,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      - name: go test -race, e2e shard 1
        run: ci/run-in-image.sh bash -c 'cd mpc-party && scripts/e2e-shard.sh run 1'

  mpc-party-e2e-2:
    name: mpc-party / e2e-2
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-e2e-2,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      - name: go test -race, e2e shard 2
        run: ci/run-in-image.sh bash -c 'cd mpc-party && scripts/e2e-shard.sh run 2'

  mpc-party-e2e-3:
    name: mpc-party / e2e-3
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-e2e-3,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      - name: go test -race, e2e shard 3
        run: ci/run-in-image.sh bash -c 'cd mpc-party && scripts/e2e-shard.sh run 3'

  # The two-party MPC signer and the custody system on it, in parallel jobs (each with its own runner, Postgres, anvil, and for
  # the custody ones Temporal and Redpanda), so a pull request waits for the slowest group, not for the sum. The heavy tests
  # (every crash boundary, kill at each custody boundary, freeze, link failures) run nightly: .github/workflows/nightly.yml.
  # See the Makefile for what is in each group. None of these is a required check; `test` is.

  mpc-signing:
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-signing,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          postgres: "true"
          infra: "false"
      - name: make test-mpc
        run: ci/run-in-image.sh make test-mpc

  # Split in two jobs by test name (Makefile test-e2e-evm-flows-1 and -2; ci/e2e-split-check.sh proves they add up to the whole group).
  e2e-evm-flows-1:
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',e2e-evm-flows-1,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
      # A shared runner is slower than a laptop: every condition wait in the custody tests gets three times as long.
