name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A newer run cancels the older one of the same pull request, and of main or dev too (a newer merge cancels the older main run), so superseded runs do
# not hold the 20 runners. What that gives up: a main commit that was followed quickly by another has no full run of its own (the newer one tests both
# together), and deploy/images/release-gate.sh needs a successful run on the commit it tags (tag the newer commit).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs run (20 jobs in all: the free plan runs 20 at once). Never skipped, never needs anything. The human's rule, which every line below serves: "Make sure that changing related code can never
  # accidentally skip a CI job that should run. Better to run too much than to miss a run."
  # Two decisions, both for pull requests only:
  #   skip       every heavy job (`build` and the e2e jobs, the mpc-party jobs, `checks`, the steps of `test`) is skipped when EVERY changed file is on the allowlist
  #              ci/skip-allowlist (documentation, three Helm charts and their test trees: files no job reads, with the evidence in CONTRIBUTING.md).
  #   skip_jobs  otherwise, the jobs that no changed file can affect (",job,job,"): ci/jobselect works it out from the Go package graph (`go list` of
  #              every module, every build tag CI uses) and ci/jobs (the packages each job tests); a non-Go file affects only the readers of its tree
  #              (ci/job-rules) and of the reviewed readers by path (ci/job-readers), anything else every job. `test` always runs (root tests read other
  #              modules' files by path). Each job below is skipped only by its own id in this list.
  # A file on no list, a rename, a mode change, a symlink, a push, a manual or merge-queue run, an error of the classifier or the selector, a change to
  # either, to their lists or to this file: everything runs. Only the exact output `true` or a clean list skips; an empty or missing output (the job
  # failed, timed out or was cancelled) runs everything. The tests of both and their guards (ci/skip-guard.sh, `jobselect check`, the group check) run
  # here on every run, and `test` fails when this job failed (it is the required check). To force a full run on a pull request: a commit message with [ci full] (CONTRIBUTING.md).
  # A new job: ci/jobselect check fails until it is in ci/jobs with the condition naming its own id (CONTRIBUTING.md, "Which jobs run").
  # It also makes the CI image (ci/qv-ci.Dockerfile: clang-20, cb-mpc, SoftHSM2, Go, tagged by a hash of its inputs, ci/image-tag.sh), FIRST: almost always
  # the tag exists and this is a no-op of a few seconds; when an input changed it builds and pushes it. Fork pull requests cannot push: their jobs pull the
  # tag if main has it, else build it themselves (ci/ensure-image.sh use).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      # Published by the LAST step only, which runs only when every earlier step succeeded (a failed guard or test leaves these empty) and then checks again
      # (ci/final.sh). Everything but the exact value `true` means: run everything.
      skip: ${{ steps.final.outputs.skip }}
      skip_jobs: ${{ steps.final.outputs.skip_jobs }}
      text: ${{ steps.final.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the CI image if its tag does not exist
        env:
          QV_CI_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: ci/ensure-image.sh publish
      - name: Build and push the Solana validator image if its tag does not exist
        env:
          QV_CI_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: ci/ensure-image.sh publish solana
      # Go for the job selector: standard library only, and `go list` runs offline (GOPROXY=off), so no module cache is needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The guards run FIRST and are plain steps: if one fails, the job fails and nothing below publishes a skip.
      - name: Tests of the job selector
        id: t_select
        run: go test -count=1 ./ci/jobselect
      - name: The job selector's guard (ci/jobs, ci/job-rules and ci.yml agree)
        id: select_guard
        run: go run ./ci/jobselect check
      # Every e2e group of the Makefile is run by some job (several groups share a job), and the runner of the groups works.
      - name: Every e2e group runs in some job
        id: groups
        run: ci/e2e-groups-check.sh
      - name: Tests of the classifier
        id: t_changes
        run: ci/changes_test.sh
      - name: Tests of the allowlist guard
        id: t_guard
        run: ci/skip-guard_test.sh
      - name: The allowlist guard
        id: guard
        run: ci/skip-guard.sh
      # A build output or a huge file in git (a 29 MB Mach-O binary once got in with a feature PR): found by magic bytes and size, on every run.
      - name: Tests of the tracked-files check
        id: t_files
        run: ci/tracked-files_test.sh
      # The repeat-run loop (scripts/e2e-repeat.sh, CONTRIBUTING.md) counts passes from go test's output: a fake go checks it counts each kind of command right.
      - name: Test of the repeat-run script
        run: scripts/e2e-repeat_test.sh
      - name: No compiled binary or oversized file is tracked
        id: files
        run: ci/tracked-files.sh
      # Fails open by itself: its EXIT trap writes skip=false, and continue-on-error keeps even a crash from failing the job (the verdict is then not success).
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          QV_EVENT_NAME: ${{ github.event_name }}
          QV_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ci/changes.sh
      - name: Publish the decision
        id: final
        env:
          QV_CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          QV_CLASSIFY_SKIP: ${{ steps.classify.outputs.skip }}
          QV_CLASSIFY_SKIP_JOBS: ${{ steps.classify.outputs.skip_jobs }}
          QV_CLASSIFY_TEXT: ${{ steps.classify.outputs.text }}
          QV_GUARD_OUTCOMES: ${{ steps.t_select.outcome }} ${{ steps.select_guard.outcome }} ${{ steps.groups.outcome }} ${{ steps.t_changes.outcome }} ${{ steps.t_guard.outcome }} ${{ steps.guard.outcome }} ${{ steps.t_files.outcome }} ${{ steps.files.outcome }}
        run: ci/final.sh

  # `test` is the check branch protection requires, so it always ends (a job skipped by its own `if:` may leave a required check pending): on a skipped
  # run (everything skipped, or `test` in skip_jobs) its first step says so and the other steps do not run. It needs `changes` only for the answer; `!cancelled()` runs it even if `changes` failed.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
    steps:
      - name: "Skipped: nothing here reads the changed files"
        if: ${{ (needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        env:
          TEXT: ${{ needs.changes.outputs.text }}
        run: |
          echo "::notice title=test skipped::$TEXT"
          echo "### test: $TEXT" >> "$GITHUB_STEP_SUMMARY"
          echo "The tests did NOT run: no changed file is read by this job (ci/skip-allowlist, ci/jobselect; CONTRIBUTING.md). Add [ci full] to a commit message to run everything."
      - uses: actions/checkout@v4
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      - uses: actions/setup-go@v5
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        with:
          go-version-file: go.mod
          cache: false
      # The module and build caches: restored from the newest run of main (keyed on go.sum and the commit), saved only by pushes to main, so the build cache
      # follows the code (one keyed on go.sum alone was written once and then compiled every changed package again in every job).
      - name: Restore the Go module and build cache
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            qv-gotest-${{ runner.os }}-${{ runner.arch }}-
      - name: Install SoftHSM2
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      # one private CA per trust zone, fresh for this job, and the two Postgres servers (TLS, client certificates) that read them
      - name: Make the TLS certificates and start Postgres
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: |
          scripts/pki.sh
          ci/infra.sh start --postgres
          ci/infra.sh wait
      - name: Set up tokens
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
        run: |
          ./scripts/dev-env.sh
          ./scripts/setup-softhsm.sh
      - run: go vet ./...
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      # -p 1: test binaries share the SoftHSM token files; a process that
      # C_Initialize's while another writes a token object can miss that
      # token for its whole lifetime (seen as "token not found").
      - run: go test -short -count=1 -p 1 ./...
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) }}
      # The guards of the `changes` job (classifier and selector tests, the guards, the group check) are not required checks themselves: `test` is, so it
      # fails when they did. Every test above still ran (with every job, as `changes` decided nothing).
      - name: The changes job and its guards passed
        if: ${{ !cancelled() && needs.changes.result != 'success' }}
        run: |
          echo "::error title=changes failed::the changes job (its guards and tests) did not succeed: ${{ needs.changes.result }}"
          exit 1
      - name: Save the Go module and build cache (pushes to main only)
        if: ${{ !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',test,'))) && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: qv-gotest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Compiles once what every e2e job used to compile for itself (one to two minutes each): the binaries the harnesses start and the test binaries of every
  # package a make target below runs (ci/e2e-prebuild.sh). The e2e jobs download them; e2e/mpcstack.GoBuild copies a prebuilt binary, ci/gotest.sh runs a
  # prebuilt test binary with go test's flags (Makefile QV_GOTEST). Skipped only when no job that needs it runs.
  build:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.skip == 'true' || contains(needs.changes.outputs.skip_jobs, ',build,'))) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
      - name: Pull the CI image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "no login: pulling anonymously"
          ci/ensure-image.sh use
      # The module and build cache: restored from the newest build of main (keyed on go.sum and the commit), saved only by pushes to main.
      - name: Restore the Go module and build cache
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/qv-go
          key: qv-go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-${{ github.sha }}
          restore-keys: |
            qv-go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-
            qv-go-build-${{ runner.os }}-${{ runner.arch }}-
            qv-go-
      - name: Restore the Go module and build cache, and save it at the end (pushes to main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/qv-go
          key: qv-go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-${{ github.sha }}
          restore-keys: |
            qv-go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mpc-party/go.sum') }}-
            qv-go-build-${{ runner.os }}-${{ runner.arch }}-
            qv-go-
      - name: Compile the binaries and the e2e test binaries
        run: |
          ci/run-in-image.sh ci/e2e-prebuild.sh .ci-prebuilt
          tar -cf prebuilt.tar .ci-prebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar
          retention-days: 1
          compression-level: 1

  # cb-mpc wrapper (C++ via cgo). Separate Go module in mpc-party/: the root-module jobs never see C++. Three jobs, all in the CI image (clang-20, cb-mpc,
  # SoftHSM2, Go); mpc-party/scripts/ci.sh is still the whole list of commands for one container:
  #   mpc-party-core  api module, vet, build, every package but e2e (internal/cbmpc about 2 minutes, internal/server)
  #   mpc-party-2     e2e shards 1 and 2 (mpc-party/scripts/e2e-shard.sh: the pins and the check that every test is in exactly one shard), restore drill, fuzz
  #   mpc-party-3     e2e shard 3
  mpc-party-core:
    name: mpc-party / core
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-core,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          go-cache-save: "true"
          anvil: "false"
      # Pure-Go API module (generated gRPC code): no cgo, no cb-mpc, no go-ethereum.
      - name: mpc-party/api vet, build, test
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party/api && go vet ./... && go build ./... && go test -count=1 ./... && ! go list -deps ./... | grep -E "go-ethereum|cb-mpc/internal"'
      - name: go vet, go build service (production tags)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go vet ./... && go build -o /dev/null ./cmd/mpc-party'
      # Every package but e2e (a new package is in here by itself). The prod binary is built without -tags devauth.
      - name: go test -race (all packages but e2e)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go test -race -count=1 -timeout 25m $(go list ./... | grep -v "/e2e$")'
      # The simulated enclave (-tags teesim: mock attester and test root, never in a production build): verifier, broker, attested sealer, migration and the
      # crash matrices with attested parties. Needs the SoftHSM tokens (QV_REQUIRE_HSM: no silent skip).
      - name: go test -race -tags teesim (simulated enclave)
        run: |
          ci/run-in-image.sh bash -c 'cd mpc-party && go test -race -count=1 -timeout 25m -tags teesim ./internal/attest/... ./cmd/qv-attest-broker/... && go test -race -count=1 -timeout 25m -tags teesim -run "TestAttested|TestMigration" ./internal/server && go test -race -count=1 -timeout 25m -tags teesim -run TestAttested ./e2e'


  mpc-party-2:
    name: mpc-party / e2e-1, e2e-2, drill and fuzz
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-2,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      - name: e2e shards 1 and 2, restore drill (destroys party B in a local stack, restores it from its backup, signs), short fuzz run
        run: |
          ci/run-groups.sh \
            'e2e-1|25|cd mpc-party && scripts/e2e-shard.sh run 1' \
            'e2e-2|25|cd mpc-party && scripts/e2e-shard.sh run 2' \
            'restore drill|15|mpc-party/scripts/restore-drill.sh' \
            'fuzz|15|cd mpc-party && go test -run "^\$" -fuzz FuzzEntryPoints -fuzztime 30s ./internal/cbmpc'


  mpc-party-3:
    name: mpc-party / e2e-3
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',mpc-party-3,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: mpc
          anvil: "false"
      - name: go test -race, e2e shard 3
        run: ci/run-in-image.sh bash -c 'cd mpc-party && scripts/e2e-shard.sh run 3'

  # The Prometheus rules of monitoring/ (promtool check rules, check config, the rule unit tests, the Go test that evaluates an alert on real counters;
  # promtool is pinned in the CI image and ci/promtool-tests.sh fails on a skipped test), and the audit-head archive against a real store in compliance mode
  # (SeaweedFS, started by the tests themselves from the digest in docker-compose.yml, through the Docker socket ci/run-in-image.sh passes) and a real Kafka
  # (Redpanda from ci/infra.sh).
  checks:
    name: checks (monitoring rules, audit archive)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',checks,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: checks
          go-cache-save: "true"
          postgres: "true"
          infra: "true"
          anvil: "false"
      - name: promtool checks and rule tests, the audit-head archive
        run: |
          ci/run-groups.sh \
            'promtool rules|25|ci/promtool-tests.sh' \
            'audit archive|15|QV_REQUIRE_DB=1 make test-archive'

  # The end-to-end groups, by chain, about seven to nine minutes of tests per job (measured on main, 2026-11-27): real mpc-party, real chains (bitcoind
  # regtest, solana-test-validator built from ci/solana, anvil), each job with its own Postgres, Temporal and Redpanda. The groups of a job run one after
  # another, each with the time limit and environment its own job had; all run even when one fails (ci/run-groups.sh), and the summary lists each.
  # What is in each group: the Makefile. The heavy tests (every crash boundary, freeze, link failures) run nightly: .github/workflows/nightly.yml.
  e2e-btc-1:
    name: e2e-btc-1 (recovery, deposits)
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !(needs.changes.result == 'success' && contains(needs.changes.outputs.skip_jobs, ',e2e-btc-1,')) }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 65
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      # the prebuilt binaries of the build job (e2e/mpcstack.GoBuild, ci/gotest.sh); a binary missing there is an error, not a silent compile
      QV_E2E_PREBUILT: ${{ github.workspace }}/.ci-prebuilt/bin
      QV_E2E_PREBUILT_STRICT: "1"
      QV_E2E_TESTBIN: ${{ github.workspace }}/.ci-prebuilt/test
      QV_GOTEST: ci/gotest.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
      - name: Unpack the prebuilt binaries
        run: tar -xf prebuilt.tar && rm prebuilt.tar
      - uses: ./.github/actions/mpc-env
        with:
          go-cache: build
          postgres: "true"
          infra: "true"
          anvil: "false"
          bitcoind: "true"
      - name: recovery, deposits
        run: |
          ci/run-groups.sh \
