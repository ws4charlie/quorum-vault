name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorumvault
          POSTGRES_USER: qv
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qv -d quorumvault"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=disable
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Set up tokens
        run: ./scripts/setup-softhsm.sh
      - run: go vet ./...
      # -p 1: test binaries share the SoftHSM token files; a process that
      # C_Initialize's while another writes a token object can miss that
      # token for its whole lifetime (seen as "token not found").
      - run: go test -short -count=1 -p 1 ./...

  # Broadcast + receipt checks: the e2e package against a local anvil node
  # impersonating Sepolia (chain ID 11155111). Same commands as `make chain-up`
  # + `make test-e2e`. Not -short: includes the MPC wallets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorumvault
          POSTGRES_USER: qv
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qv -d quorumvault"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=disable
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_REQUIRE_CHAIN: "1"
      SEPOLIA_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A service container cannot take a command, so anvil runs via docker run
      # (same image and arguments as docker-compose.yml).
      - name: Start anvil (chain ID 11155111)
        run: |
          docker run -d --name anvil -p 127.0.0.1:8545:8545 \
            ghcr.io/foundry-rs/foundry:v1.8.5 "anvil --host 0.0.0.0 --chain-id 11155111"
          for i in $(seq 1 30); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$SEPOLIA_RPC_URL"; then
              echo; exit 0
            fi
            sleep 1
          done
          docker logs anvil
          exit 1
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Set up tokens
        run: ./scripts/setup-softhsm.sh
      - run: go test -count=1 -p 1 -timeout 20m -v ./e2e/...
      - name: anvil logs
        if: failure()
        run: docker logs anvil

  # cb-mpc wrapper (C++ via cgo). Separate Go module in mpc-party/: the jobs above never see C++.
  # Same commands as mpc-party/scripts/ci.sh (which can be run in a linux/amd64 container).
  mpc-party:
    # Pinned: ubuntu-latest moved to a release that apt.llvm.org has no clang-20 repository for.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mpc-party/go.mod
      - name: Install C++ toolchain
        run: mpc-party/scripts/install-toolchain-linux.sh
      # Key: pinned cb-mpc commit + build script. Changing either rebuilds OpenSSL and the library (about 2 minutes).
      - name: Cache cb-mpc build
        uses: actions/cache@v4
        with:
          path: mpc-party/.deps
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mpc-party/cbmpc.pin', 'mpc-party/scripts/fetch-build-cbmpc.sh') }}
      - name: Build cb-mpc at the pinned commit
        run: mpc-party/scripts/fetch-build-cbmpc.sh
      - name: go vet
        working-directory: mpc-party
        run: go vet ./...
      - name: go test -race
        working-directory: mpc-party
        run: go test -race -count=1 -timeout 15m ./...
      - name: Fuzz entry points (short)
        working-directory: mpc-party
        run: go test -run '^$' -fuzz FuzzEntryPoints -fuzztime 30s ./internal/cbmpc
