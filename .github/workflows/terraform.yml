name: terraform

# Checks the AWS reference deployment (deploy/cloud/aws) without an AWS account: format, init -backend=false and validate for every root, tests with a mocked provider (the
# isolation rules), tflint and a security scan. It has no credentials, no OIDC role and no secret: nothing here can reach AWS, and deploy/cloud/aws/check.sh (step "creds")
# fails if this file ever names one. Runs only for changes under deploy/cloud/ or in this file. ci.yml runs everything for these paths (the safe default): no allowlist line.
on:
  pull_request:
    paths:
      - "deploy/cloud/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.17.2
  TFLINT_VERSION: v0.66.0
  TRIVY_VERSION: v0.76.2

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit (the comment names the release).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ hashFiles('deploy/cloud/aws/roots/*/.terraform.lock.hcl', 'deploy/cloud/aws/modules/*/versions.tf') }}
      - name: Plugin cache and tflint plugin
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          # the ruleset is downloaded from GitHub and its version is pinned in .tflint.hcl; the token is the job's read-only one and only avoids the anonymous rate limit
          GITHUB_TOKEN="${{ github.token }}" tflint --init --config=deploy/cloud/aws/.tflint.hcl
      - name: fmt, init -backend=false, validate, tests, tflint, security scan, no credentials
        run: deploy/cloud/aws/check.sh
