name: images

# Builds every container image (deploy/images/Dockerfile), smoke-tests the binaries, and checks that no layer holds a secret, a test-only build or the other
# zone's binary. NOTHING is pushed or signed from a pull request: publishing and signing exist only behind the manual `publish` input below (default off).
on:
  pull_request:
    paths:
      - "deploy/images/**"
      - "cmd/**"
      - "internal/**"
      - "mpc-party/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "deploy/postgres/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the images to ghcr.io and sign them (cosign keyless) with an SBOM. Off unless a maintainer turns it on."
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Manual runs are never cancelled by a pull request.
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build every image (production and -dev), locally only
        run: deploy/images/build.sh
      - name: Smoke test (every binary starts non-root, read-only, no network; no test-only code)
        run: deploy/images/smoke.sh
      - name: Secret paths, zones, non-root
        run: deploy/images/check-secrets.sh
      - name: Image sizes
        run: docker image ls 'qv-image/*'

  repro:
    # Two builds from scratch give the same binaries (slow: cb-mpc is built twice). Runs on the same path filter as the build job.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all binaries twice and compare SHA-256
        run: deploy/images/build.sh repro

  publish:
    # Manual only, and only when the `publish` input is true. Pushing and signing are a human decision: this job is not part of any pull request run.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [build, repro]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, push (by digest), SBOM and sign
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: deploy/images/publish.sh
