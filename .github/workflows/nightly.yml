name: nightly

# The full MPC end-to-end set once a night and on demand (Actions tab > nightly > Run workflow): the signing path, then every
# custody test on two-party MPC, including the heavy ones that pull requests skip. Pull requests run the light groups in
# .github/workflows/ci.yml. To run a single test by name, use the Makefile locally: make test-e2e-evm TEST=TestName
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:

  # The CI image of this commit's inputs (see ci.yml): a no-op when it exists, built and pushed when not.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
            mpc-party/scripts
            mpc-party/cbmpc.pin
            mpc-party/go.mod
            mpc-party/api/go.mod
            go.mod
          sparse-checkout-cone-mode: false
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image if its tag does not exist
        env:
          QV_CI_PUSH: "1"
        run: ci/ensure-image.sh publish

  mpc-nightly:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
      QV_PKI_DIR: ${{ github.workspace }}/data/pki
      DATABASE_URL: postgres://qv@localhost:55432/quorumvault?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/business/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/business/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/business/admin/tls.key
      QV_SIGNING_DB_URL: postgres://qv@localhost:55433/qv_signing?sslmode=verify-full&sslrootcert=${{ github.workspace }}/data/pki/signing/admin/ca.crt&sslcert=${{ github.workspace }}/data/pki/signing/admin/tls.crt&sslkey=${{ github.workspace }}/data/pki/signing/admin/tls.key
      QV_REQUIRE_DB: "1"
      QV_REQUIRE_HSM: "1"
      QV_ANVIL_RPC: http://127.0.0.1:18545
      # A shared runner is slower than a laptop: every condition wait in the custody tests gets three times as long.
      QV_E2E_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mpc-env
        with:
          postgres: "true"
          infra: "true"
      - name: make test-mpc
        run: ci/run-in-image.sh make test-mpc
      - name: make test-e2e-evm (all tests)
        run: ci/run-in-image.sh make test-e2e-evm
      - name: make test-e2e-evm-latency (the slow-link measurement)
        run: ci/run-in-image.sh make test-e2e-evm-latency
