name: speed1-measure
on:
  push:
    branches: [team/quorum-vault/speed-1-mpc-party-ci]
permissions:
  contents: read
jobs:
  m:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg: ["./e2e", "./internal/cbmpc", "./internal/server ./internal/backup"]
    env:
      CGO_ENABLED: "1"
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mpc-party/go.mod
      - run: mpc-party/scripts/install-toolchain-linux.sh
      - run: |
          sudo apt-get install -y softhsm2
          ./scripts/dev-env.sh
          ./scripts/setup-softhsm.sh
      - uses: actions/cache@v4
        with:
          path: mpc-party/.deps
          key: cbmpc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mpc-party/cbmpc.pin', 'mpc-party/scripts/fetch-build-cbmpc.sh') }}
      - run: mpc-party/scripts/fetch-build-cbmpc.sh
      - working-directory: mpc-party
        env:
          QV_REQUIRE_HSM: "1"
        run: go test -race -count=1 -timeout 25m -v ${{ matrix.pkg }} 2>&1 | grep -E '^(=== RUN|--- |ok|FAIL|PASS)|^\s+--- ' | grep -E '^(--- |ok|FAIL)|^\s+--- ' 
