name: helm

# Checks the business-zone chart (deploy/helm/qv-business): lint, render for production and kind values, Kubernetes schema validation, the policy test and the
# image-contract test (ci/helm). No cluster is created here. Tool versions are pinned and their downloads are checked against SHA-256 values written below.
on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "ci/helm/**"
      - "deploy/images/contract.json"
      - "deploy/images/README.md"   # compared with contract.json by ci/helm
      - "deploy/images/images.sh"
      - "deploy/images/manifest-values.py"   # release_values_test.go renders its output with each chart
      - "deploy/images/release-gate.sh"      # and checks the version rule
      - "deploy/images/publish.sh"           # and the tag-state check of the release script
      - "deploy/images/verify-release.sh"    # and the verifier
      - "deploy/images/Dockerfile"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.2
  HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983   # helm-v4.3.2-linux-amd64.tar.gz
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883   # kubeconform-linux-amd64.tar.gz

jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ci/helm/go.mod
          cache-dependency-path: ci/helm/go.sum
      - name: Install helm and kubeconform (pinned, checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -sSfLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
          mv linux-amd64/helm "$RUNNER_TEMP/tools/bin/helm"
          curl -sSfLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          mv kubeconform "$RUNNER_TEMP/tools/bin/kubeconform"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Lint, render, validate, policy and contract tests
        run: ci/helm/check.sh
